        how: { domain: lang_explorer, tools: [language_explore] }
        platforms: [web, desktop]
        samples: ["我要用 Zig 寫個小工具，但你好像不熟 Zig", "這個專案用了一個你沒看過的語言，先學起來"]
        updated: 2026-10-02
      - id: sandbox-lab
        name: 沙盒實驗（先實驗再設計）
        summary: 設計前先在沙盒真的跑一次確認行為：隔離的 iframe（可複製目前畫面）、瀏覽器控制的全新 about:blank 分頁、彈出視窗（使用者按一下）、Web Worker（有持久檔案系統、可測 handler(request)）、Python web app（micropip 安裝 Flask／FastAPI 後直接以測試請求呼叫）。先用 sandbox_capabilities 評估目前能用哪些。
        how: { tools: [sandbox_capabilities, sandbox_html, sandbox_worker, sandbox_mock, sandbox_py_app] }
        platforms: [web, desktop]
        samples: ["先用沙盒做一個點擊計數器，確認事件行為再改我的頁面", "用 Worker 模擬 Cloudflare Worker 的 handler，送幾個請求看回應", "用 Flask 寫個 API 在沙盒裡測 /hi 和 /sum"]
        updated: 2026-10-02
      - id: sandbox-mock
        name: 沙盒模擬後端（測試與部署同一份）
        summary: 被測試的頁面照常寫 fetch／XMLHttpRequest／EventSource／WebSocket，沙盒只在測試時把它們接到 Web Worker 裡的伺服器程式（iframe 與瀏覽器控制的新分頁都支援），資料存在持久儲存（IndexedDB）。伺服器程式用標準 Request／Response（router、crud、ws），可匯出成 Node 或 Cloudflare Workers 部署檔，頁面程式碼不用為了測試或部署改動。全部在瀏覽器裡跑，沙盒不使用 Cloudflare Worker 的流量（*.workers.dev、*.pages.dev 與設定的 proxy 網址一律擋下）。
        how: { tools: [sandbox_mock, sandbox_html] }
        platforms: [web, desktop]
        samples: ["幫我寫待辦清單的前端，並用沙盒模擬 REST API 測試新增、修改、刪除", "做一個聊天室，沙盒裡用模擬 WebSocket 測試兩個人互傳訊息", "測好之後匯出成 Node 伺服器讓我部署"]
        updated: 2026-10-02
      - id: repo-map
        name: 專案結構追蹤（分階段）
        summary: 有專案／repository 時先追出結構（網頁版用已授權資料夾，桌面版可直接給絕對路徑）：最小地圖→逐批展開資料夾→逐批分析檔案的定義與依賴。只給模糊名稱也能 find 出原始碼，再沿依賴 explore；路徑不存在就當結構改變，只從最近還存在的那一層重追；整份索引（index_start）會先問使用者，之後在背景漸進建立（進度卡片、可停止、可接續、大型專案如已 build 的 OpenBMC 也行，大小與檔案數有上限可調），並記下每個定義上面的註解與檔案之間的呼叫關係。
        how: { domain: coding, tools: [repo_map, repo_ask] }
        platforms: [web, desktop]
        samples: ["幫我找一下專案裡處理登入的原始碼，再看它依賴哪些檔案", "這個檔案路徑找不到了，專案是不是改過結構？", "先看一下這個 repo 的整體結構"]
        updated: 2026-10-02
      - id: repo-wiki
        name: 專案索引百科（類似 DeepWiki）
        summary: 類似 DeepWiki 的專案百科，分階段產生（避免大專案的檔案清單被截斷、也避免只得到一份空泛的 markdown）：plan 算出模組與頁面清單 → 每頁 evidence（預算內的事實與程式碼片段＋寫法規定）→ AI 寫成有說明的頁面並 write_page（驗證標題、字數、引用的檔案必須存在）→ finalize 組成單檔的查詢頁面（頁面、依賴圖、結構、定義、名詞）；沒寫的頁面用結構草稿補上；頁面多時委派 wiki_writer 子任務。存進 persistentStorage（IndexedDB），可選擇寫進專案資料夾。export 可產生單檔 HTML：內嵌 SQLite（看百科畫面、瀏覽檔案與符號、離線問答、直接下 SQL 查檔案關聯與呼叫關係）或純 HTML／JavaScript 的問答頁。
        how: { domain: [coding, wiki_writer], tools: [repo_wiki, repo_map] }
        platforms: [web, desktop]
        samples: ["幫這個專案產生可以搜尋的百科頁面", "查一下 parseConfig 這個函式定義在哪、誰在用", "幫專案裡的重要名詞寫定義，放進百科"]
        updated: 2026-10-02
      - id: repo-ask
        name: 程式碼問答（類似 doxygen＋語意搜尋）
        summary: 問專案裡「某個函式做什麼」「在哪裡定義」「誰用到它」「跟什麼相關」「某功能的程式在哪」。依 repo_map 的索引（定義、註解、簽名、依賴、呼叫關係）回答，用字串雜湊向量＋BM25＋TextRank 重排，不需要模型；回傳事實與程式碼片段讓 AI 整理成回答。同一個問答引擎也會內嵌進匯出的 HTML，離線在瀏覽器裡問。
        how: { domain: coding, tools: [repo_ask, repo_wiki] }
        platforms: [web, desktop]
        samples: ["parse_config 這個函式是做什麼的？", "誰用到 Logger 這個類別？", "處理登入的程式碼在哪些檔案？", "把這個專案匯出成可以離線查詢、能下 SQL 的 HTML"]
