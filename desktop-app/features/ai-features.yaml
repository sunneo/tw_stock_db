# AI 功能清冊（唯一的資料來源）
#
# 這份檔案同時服務三件事，改功能時只需要維護這一份：
#   1. 前端 /suggest、/ai-features 指令，以及 feature_guide 子代理人（功能說明）
#      讀到的功能介紹——build-assistant.js 會把這份清冊（不含 history）內嵌進
#      renderer/floating-assistant.js，網頁版、桌面版、aiweb 三邊拿到的一模一樣。
#   2. commit message 的功能區塊——node scripts/ai-features.js commit-msg <功能id...>
#   3. 給人看的 FEATURES.md——由 node scripts/ai-features.js build 自動產生，不要手改。
#
# 新增／修改一個 AI 功能的流程見 features/README.md。
#
# 欄位：
#   id        全域唯一，小寫英數與連字號
#   name      給使用者看的功能名稱
#   summary   一句話說明（給 /suggest、功能說明代理人引用）
#   how       怎麼用：slash（斜線指令）／tools（AI 工具名稱）／domain（子代理人領域）／ui（介面入口）
#   platforms 可用平台：web（網頁版）、desktop（桌面版）
#   samples   範例：可以直接貼給助理的話，或斜線指令
#   updated   最後一次修改功能的日期（由 record 指令維護）
#   history   修改紀錄（由 record 指令維護，不會內嵌進前端）
schema: 1
categories:
