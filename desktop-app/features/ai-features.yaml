        how: { domain: [prog_bios, know_uefi], tools: [uefi_parse, programming_knowledge, playbook_state] }
        platforms: [web, desktop]
        samples: ["幫我在 PEI 建立一個平台資訊 HOB 給 DXE 讀取（BIOS／UEFI 領域）", "幫我檢查這份 INF／DEC／DSC 有沒有錯", "這個 VFR 和 UNI 的字串對得起來嗎？"]
        updated: 2026-10-02
      - id: programming-knowledge
        name: 程式設計知識助理（Rust／UEFI／OpenBMC）
        summary: 把背景知識放在獨立的知識助理與卡片庫，避免塞爆開發領域的上下文：Rust 語法與函式庫、UEFI／EDK II（階段、Protocol、HOB、服務、變數、建置、檔案格式）、OpenBMC 分層（kernel、HAL、感測器與 Entity Manager、D-Bus 與 IPMI、Redfish、SNMP、Web）。每次只回最相關的一兩張卡，並能引導取出各開發領域的計畫範本與狀態機。
        how: { domain: [know_uefi, know_openbmc, know_rust], tools: [programming_knowledge] }
        platforms: [web, desktop]
        samples: ["Rust 的借用和生命週期是什麼意思？", "UEFI 的 gBS 和 gRT 差在哪裡？", "OpenBMC 的 Entity Manager 設定檔怎麼寫？", "給我 BMC Redfish 開發的計畫範本"]
        updated: 2026-10-02
      - id: language-explore
        name: 不認識的程式語言探索
