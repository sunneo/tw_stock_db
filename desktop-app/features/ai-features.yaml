      - id: offline-trainer
        name: 離線訓練器（AI 失效時的備援）
        summary: 不經過 AI 也能做事：純文字→槽位擷取（網址、路徑、引號）→規則與語意比對（字串雜湊向量＋中英文概念詞典）→文字重排（BM25＋TextRank＋MMR）→決定要呼叫的工具與參數（含「開分頁→讀文字→關分頁」這類多步驟做法）→執行並整理結果。畫面右上角的開關可以切成純離線；所有 AI model 都失敗時會自動退回離線（可關）。線上 AI 成功的做法、RAG 與對話紀錄會自動學進去；在「設定 → AI → 離線訓練器」可以管理領域、規則、範例句、同義詞，並用乾跑確認它會怎麼判斷（不會真的執行）。有副作用的工具執行前一定先問使用者。AI 可以用 offline_trainer 的 add_tool（原始碼工具，在沙盒 worker 執行）／add_state（狀態機）／add_pattern 把解法寫回去，離線時就能重現；勾選「自動訓練」後，長期對話的成功做法（例如一直在查 SDK 的定義）會由背景 worker 整理成「觸發規則＋狀態機＋原始碼」的技能，離線時做不到的請求會記成待辦給 AI。訓練成果（規則＋狀態機＋原始碼工具＋已學會的解法＋同義詞）可以匯出成單一 JSON 檔、在別台電腦匯入（匯入會逐一檢查原始碼語法與 checksum，並請你確認）；AI 寫的原始碼工具可用 run_tool 試跑、改壞了可以 rollback_tool。/offline-trainer-by-ai（通用，需先打開自動訓練）：讓 AI 處理一個任務或一長串同類項目（每行一項、regex 抽取或 JSON 陣列），並要求 AI 每次成功後把可重複的做法寫回離線訓練器（原始碼工具＋狀態機＋規則）；每一項先讓離線訓練器自己試，離線自己解決的比例就是訓練成效；可停止、接續、看報告。
        how: { slash: ["/offline", "/offline-dry"], tools: [offline_trainer], ui: ["畫面右上角的線上／離線開關", "設定 → AI → 離線訓練器"] }
        platforms: [web, desktop]
        samples: ["/offline on", "/offline-dry 用瀏覽器控制開啟 https://example.com 並說明內容", "把這個問答教給離線訓練器"]
        updated: 2026-10-02

