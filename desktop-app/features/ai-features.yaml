    features:
      - id: coding-workflow
        name: 程式設計流程
        summary: 評估、需求分析、設計計畫、用 git patch 修改、語法檢查、測試、發佈，可中斷後恢復（桌面版限定）。
        how: { domain: coding, tools: [coding_read_file, apply_git_patch, git_inspect, coding_task_state, coding_run_tests, coding_run_check, coding_workspace] }
        platforms: [desktop]
        samples: ["在目前工作目錄修一個 bug，全程用 git patch，改完跑測試"]
        updated: 2026-09-26
      - id: programming-domains
        name: 程式設計領域分支（各有計畫範本與狀態機）
        summary: 依領域分支的程式設計：平行程式設計、HPC、web service、生態系設計、繪圖工具、嵌入式／Raspberry Pi、BMC／OpenBMC、Android、Windows、iOS。每個領域都有固定的計畫範本與狀態機（評估→實驗→設計→實作→驗證→交付，缺欄位會被退回、每一步都告訴你下一步做什麼），專為較弱的模型設計；驗證不了的部分（硬體、工具鏈）一定要誠實列出。可以申請或替換各領域的工具。
        how: { domain: [prog_parallel, prog_hpc, prog_webservice, prog_ecosystem, prog_graphics, prog_embedded, prog_bmc, prog_bios, prog_android, prog_windows, prog_ios], tools: [playbook_state, programming_domains] }
