      - id: log-learn
        name: 離線日誌格式學習與問答
        summary: 給一份沒看過格式的文字（日誌、章節式設定檔 INI／TOML／EDK2、以及 YAML／BitBake／nginx／Dockerfile 這類行導向格式會自己長出一份文法並用全文驗證）。日誌的做法：給一份沒看過格式的文字日誌（應用程式日誌、syslog、nginx、key=value、JSON 每行一筆、帶堆疊的多行紀錄），程式自己找出格式：遮蔽時間／IP／路徑／數字、試多種分詞、把重複的行歸成模板、變動的位置變成欄位，統計次數與第一次／最後一次出現。模板存進離線訓練器（領域 log_formats），之後同格式的紀錄直接比對，並可摘要與問答（最多的錯誤、什麼時候開始、欄位值分布、找某個值）。全是程式計算不經過模型；開放式問題只回傳精簡的模板統計給 AI。
        how: { domain: research, tools: [log_learn, log_ask] }
        platforms: [web, desktop]
        samples: ["幫我學這份日誌的格式（貼上日誌）", "這份 log 哪個錯誤最多？", "這一行日誌是什麼意思？"]
        updated: 2026-10-07
        history:
