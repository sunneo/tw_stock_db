        history:
          - { date: 2026-09-30, note: "yt-dlp跟版機制：釘版本(2026.8.19)＋16項契約自檢（/media-youtube-selfcheck，載入後也會背景自動跑）＋本機預跑腳本scripts/yt-dlp-contract-precheck.js＋跟版文件DESIGN.youtube-download.md（耦合點對照表、升版流程、歷史踩雷）。自檢D4抓出JS簽章橋接正規表示式少一個右括號的真bug並修正。" }
          - { date: 2026-09-29, note: "第一次端對端驗證成功：修好micropip CDN路徑/ssl套件/yt-dlp載入順序/subprocess橋接等從沒真的跑通過的bug，新增JS簽章解密橋接（meriyah/astring+yt-dlp官方core.js，真實瀏覽器驗證），新增/media-youtube-download slash指令。發現PO Token是下一個未解決的關卡。" }
          - { date: 2026-09-29, note: "使用者要求「讓我可以直接try」：API金鑰/頻道ID改成選填，沒設定時跳過範圍驗證直接放行下載，不再是硬性擋下。" }
          - { date: 2026-09-29, note: "新增PO Token/BotGuard橋接（port自bgutil-ytdlp-pot-provider參考實作的協議，純瀏覽器fetch()完成，不需要Node服務）。實測拿到的是Google的降級版fallback token、不是完整信任的token，仍然下載不到真實格式；用真實登入的Chrome重測結果一樣，排除是自動化偵測問題。使用者決定先停在這個進度，之後如果YouTube/社群工具有新進展再回來接。" }
          - { date: 2026-09-30, note: "修好tw_stock_db_code的cloudflare-worker /proxy 路由只准GET/HEAD的bug（yt-dlp打youtubei/v1/player這支POST API被直接405擋死，跟PO Token無關）——放行POST並轉發header/body，實測405消失、請求真的打到YouTube本身。新增yt-dlp verbose輸出擷取（自訂logger）＋/media-youtube-download-verbose指令，失敗/成功都能直接在對話裡看到跟command line -v同一份診斷資訊。另外修正好幾個/media-*、/office-*斜線指令「參數驗證失敗或執行失敗時完全沒有進入對話歷史」的bug（_log()只是改單行狀態文字、不會persist），新增_failSlashCommandValidation/_failSlashCommandRuntime共用helper統一修正。" }

