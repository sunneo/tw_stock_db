        platforms: [web, desktop]
        samples: ["幫我看剛上傳的 xlsx，整理成重點表格"]
        updated: 2026-09-26
        history:
          - { date: 2026-09-26, note: "清冊補列16個原始碼已有的工具（fs_*/tmux_*/fap_copy_*/attachment_apply_patch等）" }
