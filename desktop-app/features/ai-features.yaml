# AI 功能清冊（唯一的資料來源）
#
# 這份檔案同時服務三件事，改功能時只需要維護這一份：
#   1. 前端 /suggest、/ai-features 指令，以及 feature_guide 子代理人（功能說明）
#      讀到的功能介紹——build-assistant.js 會把這份清冊（不含 history）內嵌進
#      renderer/floating-assistant.js，網頁版、桌面版、aiweb 三邊拿到的一模一樣。
#   2. commit message 的功能區塊——node scripts/ai-features.js commit-msg <功能id...>
#   3. 給人看的 FEATURES.md——由 node scripts/ai-features.js build 自動產生，不要手改。
#
# 新增／修改一個 AI 功能的流程見 features/README.md。
#
# 欄位：
#   id        全域唯一，小寫英數與連字號
#   name      給使用者看的功能名稱
#   summary   一句話說明（給 /suggest、功能說明代理人引用）
#   how       怎麼用：slash（斜線指令）／tools（AI 工具名稱）／domain（子代理人領域）／ui（介面入口）
#   platforms 可用平台：web（網頁版）、desktop（桌面版）
#   samples   範例：可以直接貼給助理的話，或斜線指令
#   updated   最後一次修改功能的日期（由 record 指令維護）
#   history   修改紀錄（由 record 指令維護，不會內嵌進前端）
schema: 1
categories:
  - id: assistant
    name: 助理本身
    summary: 對話、建議、模型與多代理人分工
    features:
      - id: suggest
        name: 建議操作
        summary: 一開始或清空對話後，顯示可以直接點的建議；輸入 /suggest 可以重新顯示。
        how: { slash: ["/suggest"] }
        platforms: [web, desktop]
        samples: ["/suggest"]
        updated: 2026-09-26
        history:
          - { date: 2026-09-26, note: "內建 /suggest 至少列出 AI 功能總覽；新增 /ai-features 與 feature_guide 功能說明子代理人" }
      - id: ai-features
        name: AI 功能總覽
        summary: 列出助理所有功能（依分類），也可以查單一分類或單一功能的說明與範例。
        how: { slash: ["/ai-features"], domain: feature_guide, tools: [list_ai_features] }
        platforms: [web, desktop]
        samples: ["/ai-features", "/ai-features media", "你有哪些功能？", "怎麼把影片轉成逐字稿？"]
        updated: 2026-09-26
        history:
          - { date: 2026-09-26, note: "內建 /suggest 至少列出 AI 功能總覽；新增 /ai-features 與 feature_guide 功能說明子代理人" }
          - { date: 2026-09-26, note: "範例改成開 Yahoo 新聞；/ai-features 的範例後面附「▶ 送出」連結可直接送出" }
      - id: subagent-delegation
        name: 專家子代理人分工
        summary: 複雜任務會自動委派給專門領域的子代理人（檔案解讀、3D、繪圖、影音、程式設計…），只把結論帶回主對話，不污染上下文。
        how: { tools: [delegate_to_subagent, get_tool_details], ui: ["設定 → 多代理人模式"] }
        platforms: [web, desktop]
        samples: ["幫我用 3D 畫一個太陽系，並且做成可以旋轉的場景"]
        updated: 2026-09-26
      - id: benchmark-model
        name: 模型基準測試
        summary: 對指定模型跑簡易回應、單一工具呼叫、完整多步驟報告三項測試並算加權總分，評估要不要內建。
        how: { slash: ["/benchmark-model"] }
        platforms: [web, desktop]
        samples: ["/benchmark-model nvidia/nemotron-3-super-120b-a12b"]
        updated: 2026-09-26
      - id: theme
        name: 淺色／深色主題
        summary: 上方列的主題按鈕切換淺色或深色，設定面板也會跟著換。
        how: { ui: ["上方列主題按鈕"] }
        platforms: [web, desktop]
        samples: []
        updated: 2026-09-26
      - id: chat-list
        name: 對話清單（左邊，可收合、可分群組）
        summary: 桌面版與 aiweb 左邊有可拖曳調整寬度、可收合的對話清單，每個對話各有自己的訊息；可以新增、切換、刪除，也能分群組（拖曳或右鍵移動）。右鍵對話可重新命名、匯出 Markdown／JSON、刪除。單機版存成檔案（使用者資料夾 AppData/Roaming/floating-assistant-desktop/chats），aiweb 存在瀏覽器的 persistentStorage；台股頁不啟用。
        how: { ui: ["左邊對話清單（☰ 收合、右鍵選單）"] }
        platforms: [desktop]
        samples: []
        updated: 2026-09-26
        history:
          - { date: 2026-09-26, note: "新增左邊對話清單：可收合、可調寬度、可分群組、右鍵匯出／重新命名／刪除；單機存檔案、aiweb 存 persistentStorage" }
      - id: festival-themes
        name: 台灣節慶套版
        summary: 依台灣行事曆（連假也算同一個節慶）自動換上春節、元宵、端午、中秋、國慶、聖誕…的套版，越接近節日越豐富（中秋前月亮漸盈、春節前逐漸高掛鞭炮）；套版從 GitHub 的 festival-themes 分支下載，每個不超過 1MB。
        how: { ui: ["設定 → LLM 基礎設定 → 啟用台灣節慶套版"] }
        platforms: [web, desktop]
        samples: []
        updated: 2026-09-26
        history:
          - { date: 2026-09-26, note: "新增台灣節慶套版：三區（上／中／下）、越接近節日越豐富、混合風、可在 LLM 基礎設定開關" }
      - id: offline-trainer
        name: 離線訓練器（AI 失效時的備援）
        summary: 不經過 AI 也能做事：純文字→槽位擷取（網址、路徑、引號）→規則與語意比對（字串雜湊向量＋中英文概念詞典）→文字重排（BM25＋TextRank＋MMR）→決定要呼叫的工具與參數（含「開分頁→讀文字→關分頁」這類多步驟做法）→執行並整理結果。畫面右上角的開關可以切成純離線；所有 AI model 都失敗時會自動退回離線（可關）。線上 AI 成功的做法、RAG 與對話紀錄會自動學進去；在「設定 → AI → 離線訓練器」可以管理領域、規則、範例句、同義詞，並用乾跑確認它會怎麼判斷（不會真的執行）。有副作用的工具執行前一定先問使用者。AI 可以用 offline_trainer 的 add_tool（原始碼工具，在沙盒 worker 執行）／add_state（狀態機）／add_pattern 把解法寫回去，離線時就能重現；勾選「自動訓練」後，長期對話的成功做法（例如一直在查 SDK 的定義）會由背景 worker 整理成「觸發規則＋狀態機＋原始碼」的技能，離線時做不到的請求會記成待辦給 AI。訓練成果（規則＋狀態機＋原始碼工具＋已學會的解法＋同義詞）可以匯出成單一 JSON 檔、在別台電腦匯入（匯入會逐一檢查原始碼語法與 checksum，並請你確認）；AI 寫的原始碼工具可用 run_tool 試跑、改壞了可以 rollback_tool。/offline-trainer-by-ai（需先打開自動訓練）：把一長串同類項目（例如 cve-check 報告裡上萬條 CVE）一項一項交給 AI 處理並要求 AI 每次成功後把做法寫回離線訓練器；每一項先讓離線訓練器自己試，離線自己解決的比例就是訓練成效；可停止、接續、看報告。
        how: { slash: ["/offline", "/offline-dry"], tools: [offline_trainer], ui: ["畫面右上角的線上／離線開關", "設定 → AI → 離線訓練器"] }
        platforms: [web, desktop]
        samples: ["/offline on", "/offline-dry 用瀏覽器控制開啟 https://example.com 並說明內容", "把這個問答教給離線訓練器"]
        updated: 2026-10-02

