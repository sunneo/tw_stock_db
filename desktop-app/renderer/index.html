<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>FloatingAssistant</title>
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #0d1117; font-family: -apple-system, "Segoe UI", sans-serif; }
  #topbar {
    display: flex; align-items: center; gap: 14px; padding: 6px 12px;
    background: #161b22; border-bottom: 1px solid #30363d; color: #cbd5e1; font-size: 12px;
  }
  #topbar label { display: flex; align-items: center; gap: 5px; cursor: pointer; user-select: none; }
  #topbar .sep { flex: 1; }
  #topbar .badge { padding: 2px 8px; border-radius: 10px; background: #1f2937; color: #93a4b7; }
  #topbar button { background: #21262d; color: #cbd5e1; border: 1px solid #30363d; border-radius: 6px; padding: 3px 10px; cursor: pointer; font-size: 12px; }
  #topbar button:hover { background: #30363d; }
</style>
</head>
<body>
  <div id="topbar">
    <span class="badge">🖥️ 桌面版（直接存取，不透過雲端）</span>
    <button type="button" id="topbar-secrets-btn" title="設定NVIDIA/OpenRouter API金鑰（存在本機secrets.json，不會出現在畫面上）">🔑 設定API金鑰</button>
    <button type="button" id="topbar-add-folder-btn" title="直接輸入資料夾路徑授權（跳過原生資料夾選擇對話框，適合原生對話框沒反應/開到看不到的地方時使用）">📁 直接輸入路徑新增資料夾</button>
    <label><input type="checkbox" id="topbar-exec-enabled"> 允許AI執行程式</label>
    <label><input type="checkbox" id="topbar-exec-confirm" checked> 每次執行前跳確認框</label>
    <span class="sep"></span>
    <span id="topbar-proxy-status" class="badge">本地proxy：啟動中…</span>
  </div>
  <!--
    floating-assistant.js的mount()邏輯（`mount.style.display = mount.style.display
    || 'inline-flex';`）只在mount元素完全沒有inline style.display時才會套用它
    自己預設的'inline-flex'（這是給「小工具疊在網頁上」的預設情境設計的，
    inline-flex會shrink-to-fit內容寬度，不會撐滿容器）。這裡故意先給一個
    真正的inline style="display:block"屬性（不是外部<style>規則——外部
    stylesheet不會反映在JS讀到的`element.style.display`上，一定要是inline
    屬性才擋得住），讓上面那行的`||`短路、不會被蓋掉，桌面版視窗才能真正
    撐滿寬度，不是只有高度。這個bug害面板只剩~475px寬、右邊一大片空白，
    实測（真的跑起來截圖+查computed style）才抓到的，不是憑空猜的。
  -->
  <div id="app" style="display:block; width:100%; height:calc(100% - 33px);"></div>

  <script src="floating-assistant.js"></script>
  <script src="bootstrap.js"></script>
</body>
</html>
