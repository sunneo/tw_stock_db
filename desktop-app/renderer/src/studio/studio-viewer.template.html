async function pollBench(tb,bStart,bStop){bStart.disabled=true;bStop.disabled=false;clearTimeout(pollBench.t);

 r.rows.forEach(function(w){var x=w.result||{},nc=x.numericCheck;t.appendChild(h('tr',{},[h('td',{text:w.id}),h('td',{text:{pending:'等待',running:'執行中…',skipped:'略過',passed:'通過',failed:'未通過',aborted:'已中斷'}[w.state]||w.state}),h('td',{text:x.tokPerSec?x.tokPerSec.toFixed(1):'—'}),h('td',{text:x.stepMsP50?Math.round(x.stepMsP50)+'／'+Math.round(x.stepMsP95)+' ms':'—'}),h('td',{text:x.peakMemBytes?fmtB(x.peakMemBytes):'—'}),h('td',{text:nc?(nc.pass?'通過':'失敗：'+(nc.failed||[]).join('、')):'—'}),h('td',{text:w.reason||x.reason||''})]))});

async function pollTrain(prog,cv,once){clearTimeout(pollTrain.t);var r=await api('GET','/api/train/status');if(r.ok===false)return;
 if(r.state==='idle'){return}
 (r.events||[]).forEach(function(e){if(e.type==='log'&&isFinite(e.loss)){if(!lossHist.length||lossHist[lossHist.length-1].s!==e.step)lossHist.push({s:r.step,l:e.loss})}});
 prog.firstChild.textContent='狀態：'+r.state+'　step '+r.step+'　loss '+(r.loss==null?'—':Number(r.loss).toFixed(4))+'　用時 '+Math.round(r.elapsedMs/1000)+' 秒'+(r.errors&&r.errors.length?'　錯誤：'+r.errors.join(' | '):'');
 var c=cv.getContext('2d');c.clearRect(0,0,cv.width,cv.height);var hs=lossHist.slice(-200);if(hs.length>1){var mx=Math.max.apply(null,hs.map(function(p){return p.l})),mn=Math.min.apply(null,hs.map(function(p){return p.l}));c.strokeStyle='#58a6ff';c.beginPath();hs.forEach(function(p,i){var x=i/(hs.length-1)*cv.width,y=cv.height-4-(mx===mn?.5:(p.l-mn)/(mx-mn))*(cv.height-8);i?c.lineTo(x,y):c.moveTo(x,y)});c.stroke()}
 if(r.running)pollTrain.t=setTimeout(function(){pollTrain(prog,cv)},2000)}
