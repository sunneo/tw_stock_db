<!doctype html><meta charset="utf-8"><title>batch layer check</title>
<body style="font:13px monospace;white-space:pre">
<script>
// O6 驗證（真 Chrome、真 WebGPU）：批次介面（nn_ops.createBatch）跑一串「層」運算：rmsnorm → matmul → rope → matmul → silu → matmul。
// 判準：(1) 批次只 submit 一次（計次：包 dev.queue.submit）；(2) 與「每個運算各自 runWgsl」的結果逐位相同；(3) 兩種形狀：
//   A：T=16, d=64（K、N 為 4 的倍數，走 vec4 矩陣乘）；B：T=33, d=50（不是 4 的倍數，走純量平鋪）。
// 另量各自的牆鐘時間（中位數 5 次），標這台硬體。結果在 window.__out。
// 用法：desktop-app 資料夾 python -X utf8 -m http.server <埠> --bind 127.0.0.1，開 http://127.0.0.1:<埠>/scripts/eval/batch_layer_check.html
const mods = {};
const loadMod = async (key, url) => {
  const src = await (await fetch(url, { cache: 'no-store' })).text();
  const m = { exports: {} }; mods[key] = m;
  new Function('module', 'exports', 'require', src)(m, m.exports, (p) => { const k = p.replace(/^\.\//, '').replace(/\.js$/, ''); if (!mods[k]) throw new Error('missing ' + k); return mods[k].exports; });
};
let seed = 5;
const rnd = () => { seed = (Math.imul(seed, 1664525) + 1013904223) | 0; return (seed >>> 0) / 4294967296 - 0.5; };
const mk = (n) => Float32Array.from({ length: n }, rnd);
const same = (x, y) => { if (x.length !== y.length) return false; for (let i = 0; i < x.length; i++) if (x[i] !== y[i]) return false; return true; };
(async () => {
  const out = { hardware: 'Kepler 14 W（同一台、同一瀏覽器）', cases: [], error: null };
  try {
    await loadMod('gpu_core', '../../renderer/src/gpu/gpu_core.js');
    await loadMod('gpu_pool', '../../renderer/src/gpu/gpu_pool.js');
    await loadMod('nn_ops', '../../renderer/src/gpu/nn_ops.js');
    const core = mods.gpu_core.exports, nn = mods.nn_ops.exports;
    const { dev } = await nn.getDevice(navigator);
    let submits = 0;
    const realSubmit = dev.queue.submit.bind(dev.queue);
    dev.queue.submit = (cmds) => { submits++; return realSubmit(cmds); };
    const u32f = (words, eps, epsAt) => { const b = new ArrayBuffer(16); new Uint32Array(b, 0, words.length).set(words); if (epsAt !== undefined) new Float32Array(b, epsAt, 1)[0] = eps; return new Uint8Array(b); };
    const mmUni = (M, K, N) => new Uint8Array(new Uint32Array(core.mmTileWords(M, K, N, 0, 1)).buffer);
    const runOne = async (code, ins, uni, groups, outN) => (await nn.runWgsl(dev, code, [...ins.map((d) => ({ data: d })), { data: new Float32Array(outN), out: true }], uni, groups))[0];
    for (const cfg of [{ name: 'A_T16_d64_H4', T: 16, d: 64, H: 4, hd: 16 }, { name: 'B_T33_d50_H5', T: 33, d: 50, H: 5, hd: 10 }]) {
      const { T, d, H, hd } = cfg;
      const x = mk(T * d), g = mk(d), Wq = mk(d * d), Wo = mk(d * d), Wd = mk(d * d);
      const eps = 1e-6;
      const MMcode = (d % 4 === 0) ? core.mmTileWgslVec4({ marker: 'matmul_vec4' }) : core.mmTileWgsl({ marker: 'matmul', dtype: 'f32' });
      const mmGroups = core.mmTileDispatch(T, d, 1);
      // 批次
      const timeBatch = async () => {
        submits = 0;
        const b = nn.createBatch(dev);
        const xb = b.upload(x), gb = b.upload(g), wq = b.upload(Wq), wo = b.upload(Wo), wd = b.upload(Wd);
        const n1 = b.rmsnorm(xb, gb, T, d, eps);
        const q = b.matmul(n1, wq, T, d, d);
        const r = b.rope(q, T, H, hd, 1);
        const o = b.matmul(r, wo, T, d, d);
        const s = b.silu(o);
        const dn = b.matmul(s, wd, T, d, d);
        const [res] = await b.read([[dn, T * d]]);
        return { res, submits };
      };
      // 逐運算（每個運算各自 runWgsl，各自 submit）
      const runSeparate = async () => {
        submits = 0;
        const rms = new ArrayBuffer(16); new Uint32Array(rms, 0, 2).set([T, d]); new Float32Array(rms, 8, 1)[0] = eps;
        const n1 = await runOne(nn.WGSL_RMSNORM, [x, g], new Uint8Array(rms), Math.ceil(T / 64), T * d);
        const q = await runOne(MMcode, [n1, Wq], mmUni(T, d, d), mmGroups, T * d);
        const rb = new ArrayBuffer(16); new Uint32Array(rb, 0, 3).set([T, H, hd]); new Float32Array(rb, 12, 1)[0] = 1;
        const r = await runOne(nn.WGSL_ROPE, [q], new Uint8Array(rb), Math.ceil(T * H * (hd / 2) / 64), T * d);
        const o = await runOne(MMcode, [r, Wo], mmUni(T, d, d), mmGroups, T * d);
        const sb = new ArrayBuffer(16); new Uint32Array(sb, 0, 1)[0] = T * d;
        const s = await runOne(nn.WGSL_SILU, [o], new Uint8Array(sb), Math.ceil(T * d / 64), T * d);
        const dn = await runOne(MMcode, [s, Wd], mmUni(T, d, d), mmGroups, T * d);
        return { res: dn, submits };
      };
      // 先各跑一次確認結果，再計時
      const b1 = await timeBatch();
      const s1 = await runSeparate();
      const bitExact = same(b1.res, s1.res);
      const med = async (fn) => { await fn(); const ts = []; for (let i = 0; i < 5; i++) { const t0 = performance.now(); await fn(); ts.push(performance.now() - t0); } ts.sort((p, q) => p - q); return Math.round(ts[2] * 10) / 10; };
      out.cases.push({ name: cfg.name, batchSubmits: b1.submits, separateSubmits: s1.submits, bitExact, matmulKernel: d % 4 === 0 ? 'vec4' : 'scalar', batchMs: await med(timeBatch), separateMs: await med(runSeparate), pass: b1.submits === 1 && bitExact });
    }
    dev.queue.submit = realSubmit;
  } catch (e) { out.error = String(e && e.stack || e); }
  out.allPass = !out.error && out.cases.length === 2 && out.cases.every((c) => c.pass);
  window.__out = out; document.body.textContent = JSON.stringify(out, null, 1); document.title = 'done';
})();
</script>
