<!doctype html><meta charset="utf-8"><title>matmulnbits dec check</title>
<body style="font:13px monospace;white-space:pre">
<script>
// 真 Chrome（真 WebGPU）驗證 matmulnbits_gpu 的解碼變體 matmulnbits_dec 與逐格版，對 matmulnbits_ref 參考。
// 判準（清單 O3）：相對誤差 ≤1e-5（f32 累加）；layer 必須是 T1。時間只是參考（牆鐘，含上傳讀回），只標這台機器。
// 用法：在 desktop-app 資料夾 python -m http.server <埠> 後開 http://127.0.0.1:<埠>/scripts/eval/matmulnbits_dec_check.html ；結果在 window.__out。
const mods = {};
const load = async (name) => {
  const src = await (await fetch('../../renderer/src/gpu/' + name + '.js', { cache: 'no-store' })).text();
  const m = { exports: {} }; mods[name] = m;
  new Function('module', 'exports', 'require', src)(m, m.exports, (p) => { const k = p.replace(/^\.\//, '').replace(/\.js$/, ''); if (!mods[k]) throw new Error('missing ' + k); return mods[k].exports; });
};
(async () => {
  const out = { adapter: null, cases: [], time: [], error: null };
  try {
    await load('gpu_core'); await load('gpu_pool'); await load('nn_ops'); await load('matmulnbits_ref'); await load('matmulnbits_gpu');
    const R = mods.matmulnbits_ref.exports, G = mods.matmulnbits_gpu.exports;
    if (navigator.gpu) { const a = await navigator.gpu.requestAdapter(); if (a) out.adapter = { vendor: a.info && a.info.vendor, arch: a.info && a.info.architecture }; }
    let s = 31; const rnd = () => { s = (Math.imul(s, 1664525) + 1013904223) | 0; return (s >>> 0) / 4294967296 - 0.5; };
    const relErr = (x, y) => { let mx = 0, sc = 1e-12; for (let i = 0; i < y.length; i++) { mx = Math.max(mx, Math.abs(x[i] - y[i])); sc = Math.max(sc, Math.abs(y[i])); } return mx / sc; };
    const mkCase = (M, K, N) => {
      const nb = R.nBlocksOf(K);
      const q = Uint8Array.from({ length: N * K }, () => Math.floor((rnd() + 0.5) * 16) & 15);
      return { A: Float32Array.from({ length: M * K }, rnd), B: R.packQ4(q, N, K), sc: Float32Array.from({ length: N * nb }, () => Math.abs(rnd()) * 0.1 + 0.01) };
    };
    // 形狀：K 不是 32 的倍數、N 不是 16 的倍數、M 小（解碼）；最後一個 M=16 只量逐格版（應走 matmulnbits）
    for (const [M, K, N] of [[1, 32, 16], [1, 96, 20], [2, 40, 33], [3, 300, 17], [1, 1024, 48], [8, 1024, 256]]) {
      const c = mkCase(M, K, N);
      const ref = R.matmulNBitsRef(c.A, M, K, c.B, c.sc, N);
      const row = { M, K, N };
      for (const v of ['matmulnbits_dec', 'matmulnbits']) {
        const r = await G.matmulNBits(c.A, M, K, c.B, c.sc, N, { navigator: navigator, nbVariant: v });
        row[v] = { layer: r.info.layer, reason: r.info.reason, relErr: relErr(r.result, ref), pass: r.info.layer === 'T1' && relErr(r.result, ref) <= 1e-5 };
      }
      out.cases.push(row);
    }
    // 計時（只標這台機器）：解碼形狀 M=1、K=1024、N=3072，5 次取中位數
    const c = mkCase(1, 1024, 3072);
    const timeIt = async (v) => {
      const run = () => G.matmulNBits(c.A, 1, 1024, c.B, c.sc, 3072, { navigator: navigator, nbVariant: v });
      await run(); const ts = [];
      for (let i = 0; i < 5; i++) { const t0 = performance.now(); await run(); ts.push(performance.now() - t0); }
      ts.sort((a, b) => a - b); return Math.round(ts[2] * 10) / 10;
    };
    out.time.push({ shape: 'M1xK1024xN3072', matmulnbits_decMs: await timeIt('matmulnbits_dec'), matmulnbitsMs: await timeIt('matmulnbits') });
  } catch (e) { out.error = String(e && e.stack || e); }
  window.__out = out; document.body.textContent = JSON.stringify(out, null, 1); document.title = 'done';
})();
</script>
