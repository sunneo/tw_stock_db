<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>O12f GPU（q8 通用引擎）對 CPU 參考</title>
</head>
<body>
<h1>O12f：q8 通用解碼（qwen_gpu 引擎、無 qk-norm）對 骨架 CPU 參考</h1>
<p>權重：model_quantized.onnx 的 int8 投影改成 uint8（xor 0x80，zero point 128）；嵌入與 lm_head 沿用 uint8（zero point 128）；RoPE 表用 llama3 invFreq。
這一頁只比 GPU 與 CPU 參考（不依賴 ORT）。</p>
<pre id="out">執行中…</pre>
<script src="../../renderer/src/gpu/llm_arch.js"></script>
<script src="../../renderer/src/gpu/onnx_lite.js"></script>
<script src="../../renderer/src/gpu/llm_skeleton.js"></script>
<script src="../../renderer/src/gpu/llm_q8_onnx.js"></script>
<script src="../../renderer/src/gpu/qwen_decode.js"></script>
<script src="../../renderer/src/gpu/qwen_gpu.js"></script>
<script>
(async function () {
  const out = document.getElementById('out');
  const log = [];
  const say = (s) => { log.push(s); out.textContent = log.join('\n'); };
  try {
    if (!navigator.gpu) throw new Error('沒有 WebGPU');
    const adapter = await navigator.gpu.requestAdapter();
    if (!adapter) throw new Error('requestAdapter 回傳空值');
    const device = await adapter.requestDevice();
    say('adapter: ' + ((adapter.info && adapter.info.vendor) || '?') + ' / ' + ((adapter.info && adapter.info.architecture) || '?') + '；maxStorageBufferBindingSize=' + device.limits.maxStorageBufferBindingSize);
    const arch = Object.assign({}, self.FaLlmArch.FAMILIES['llama-3.2-1b']);
    const buf = await (await fetch('/ai-temp/llama32-1b/model_quantized.onnx')).arrayBuffer();
    const u8 = new Uint8Array(buf);
    const w = self.FaLlmQ8Onnx.loadQ8(u8, arch);
    const H = arch.hidden, hd = arch.headDim, half = hd / 2, maxT = 32;
    const fr = self.FaLlmSkeleton.invFreq(hd, arch.rope.base, arch.rope.scaling);
    const cos = new Float32Array(maxT * half), sin = new Float32Array(maxT * half);
    for (let p = 0; p < maxT; p++) for (let i = 0; i < half; i++) { cos[p * half + i] = Math.cos(p * fr[i]); sin[p * half + i] = Math.sin(p * fr[i]); }
    // int8 → uint8（xor 0x80，等於 +128 再取位元組），zero point 128
    const toU8 = (i8) => { const o = new Uint8Array(i8.length); for (let i = 0; i < i8.length; i++) o[i] = i8[i] ^ 0x80; return o; };
    const layers = w.layers.map((L) => {
      const o = { inNorm: L.inNorm, postNorm: L.postNorm };
      for (const k of ['q', 'k', 'v', 'o', 'g', 'u', 'd']) o[k] = { W: toU8(L.as ? L.as : L[k].q), zp: 128, scale: L[k].scale, K: L[k].K, N: L[k].N };
      return o;
    });
    const E = w.emb.W;
    const W = {
      D: H, H: arch.heads, Hkv: arch.kvHeads, hd: hd, I: arch.ffn, V: arch.vocab, L: arch.layers, eps: w.eps,
      cosSin: { rows: maxT, cos: cos, sin: sin }, finalNorm: w.finalNorm, layers: layers, qkNorm: false,
      emb: { W: E, zp: w.emb.zp, scale: w.emb.scale },
      embedRows(ids) { const o = new Float32Array(ids.length * H); for (let i = 0; i < ids.length; i++) for (let j = 0; j < H; j++) o[i * H + j] = (E[ids[i] * H + j] - w.emb.zp) * w.emb.scale; return o; },
    };
    const t0 = performance.now();
    const eng = await self.FaQwenGpu.createGpuEngine(device, W, { maxT: maxT, maxM: 8, fuseRmsQuant: false });
    say('engine ' + Math.round(performance.now() - t0) + ' ms；info=' + JSON.stringify({ dispatches: eng.info.dispatches, gpuBytes: eng.info.gpuBytes }));
    // CPU 參考（同一份 int8 權重，骨架 q8 路徑）
    const st = self.FaLlmQ8Onnx.createQ8State(arch, w);
    const tokens = [128000, 9906, 1917, 374];
    const rows = [];
    for (let s = 0; s < tokens.length; s++) {
      const tc = performance.now();
      const lc = self.FaLlmQ8Onnx.stepQ8(st, tokens[s]);
      const cpuMs = performance.now() - tc;
      const tg = performance.now();
      const r = await eng.step([tokens[s]], { logits: true });
      const gpuMs = performance.now() - tg;
      const lg = r.logits;
      let maxAbs = 0, sc = 0, bc = 0, bg = 0;
      for (let i = 0; i < lc.length; i++) { const d = Math.abs(lc[i] - lg[i]); if (d > maxAbs) maxAbs = d; if (Math.abs(lc[i]) > sc) sc = Math.abs(lc[i]); }
      for (let i = 1; i < lc.length; i++) { if (lc[i] > lc[bc]) bc = i; if (lg[i] > lg[bg]) bg = i; }
      const row = { step: s, tok: tokens[s], cpuMs: Math.round(cpuMs), gpuMs: Math.round(gpuMs), maxAbsDiff: +maxAbs.toFixed(5), maxRel: +(maxAbs / sc).toFixed(5), argmaxCpu: bc, argmaxGpu: bg, argmaxSame: bc === bg };
      rows.push(row); say(JSON.stringify(row));
    }
    window.__o12f_gpu = { ok: true, rows: rows };
    say('DONE');
  } catch (e) {
    window.__o12f_gpu = { ok: false, error: String((e && e.stack) || e) };
    say('ERROR ' + String((e && e.stack) || e));
  }
})();
</script>
</body>
</html>
