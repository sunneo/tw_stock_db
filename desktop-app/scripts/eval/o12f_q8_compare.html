<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>O12f 骨架 q8 CPU 對 ORT</title>
</head>
<body>
<h1>O12f：骨架 q8 CPU 參考 對 ORT 逐步 logits</h1>
<p>ORT 參考來自 IndexedDB（o12f_ort_steps.html 產生）。骨架用真權重（model_quantized.onnx）逐詞元解碼。</p>
<pre id="out">執行中…</pre>
<script src="../../renderer/src/gpu/llm_arch.js"></script>
<script src="../../renderer/src/gpu/onnx_lite.js"></script>
<script src="../../renderer/src/gpu/llm_skeleton.js"></script>
<script src="../../renderer/src/gpu/llm_q8_onnx.js"></script>
<script>
(async function () {
  const out = document.getElementById('out');
  const log = [];
  const say = (s) => { log.push(s); out.textContent = log.join('\n'); };
  try {
    const db = await new Promise((res, rej) => { const r = indexedDB.open('o12f', 1); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
    const ref = await new Promise((res, rej) => { const tx = db.transaction('ref'); const q = tx.objectStore('ref').get('llama32-1b'); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); });
    db.close();
    if (!ref) throw new Error('IndexedDB 沒有 ORT 參考');
    const arch = Object.assign({}, self.FaLlmArch.FAMILIES['llama-3.2-1b']);
    const t0 = performance.now();
    const buf = await (await fetch('/ai-temp/llama32-1b/model_quantized.onnx')).arrayBuffer();
    const u8 = new Uint8Array(buf);
    say('fetch ' + Math.round(performance.now() - t0) + ' ms（' + u8.length + ' bytes）');
    const t1 = performance.now();
    const w = self.FaLlmQ8Onnx.loadQ8(u8, arch);
    say('loadQ8 ' + Math.round(performance.now() - t1) + ' ms；ops=' + JSON.stringify(w.opCounts));
    const st = self.FaLlmQ8Onnx.createQ8State(arch, w);
    const rows = [];
    for (let s = 0; s < ref.tokens.length; s++) {
      const t2 = performance.now();
      const lg = self.FaLlmQ8Onnx.stepQ8(st, ref.tokens[s]);
      const ms = performance.now() - t2;
      const og = ref.logits[s];
      let maxAbs = 0, scale = 0, ca = 0, og0 = 0;
      for (let i = 0; i < lg.length; i++) { const d = Math.abs(lg[i] - og[i]); if (d > maxAbs) maxAbs = d; if (Math.abs(og[i]) > scale) scale = Math.abs(og[i]); }
      let bc = 0, bo = 0; for (let i = 1; i < lg.length; i++) { if (lg[i] > lg[bc]) bc = i; if (og[i] > og[bo]) bo = i; }
      const topC = Array.from(lg.keys()).sort((a, b) => lg[b] - lg[a]).slice(0, 8);
      const topO = Array.from(og.keys()).sort((a, b) => og[b] - og[a]).slice(0, 8);
      const overlap = topC.filter((i) => topO.indexOf(i) >= 0).length;
      const r = { step: s, tok: ref.tokens[s], cpuMs: Math.round(ms), ortMs: Math.round(ref.timesMs[s]), maxAbsDiff: +maxAbs.toFixed(5), maxRel: +(maxAbs / scale).toFixed(5),
        argmaxCpu: bc, argmaxOrt: bo, argmaxSame: bc === bo, top8Overlap: overlap, cpuLogitAtOrtArgmax: +lg[bo].toFixed(4), ortLogitAtOrtArgmax: +og[bo].toFixed(4) };
      rows.push(r); say(JSON.stringify(r));
    }
    window.__o12f_cpu = { ok: true, rows: rows };
    say('DONE');
  } catch (e) {
    window.__o12f_cpu = { ok: false, error: String((e && e.stack) || e) };
    say('ERROR ' + String((e && e.stack) || e));
  }
})();
</script>
</body>
</html>
