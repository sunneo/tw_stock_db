<!doctype html><meta charset="utf-8"><title>o6 attn batch check</title>
<body style="font:13px monospace;white-space:pre">
<script>
// O6 驗證（真 Chrome、真 WebGPU）：批次版注意力（attn_gpu.attnCoreBatched）。q、kc、vc 都是批次句柄，整段一次 submit、回讀只在最後。
// 對照：attn_ops.attnCore（CPU 參考）。判準：(1) 每個案例 1 次 submit；(2) 相對誤差 ≤1e-5。
// 案例：decode S=1 past=512 H16 Hkv8 hd128（attn_flash）；prefill S=16 past=0 H8 Hkv8 hd64（attn_flash）；小形狀 S=3 past=5 H4 Hkv2 hd32（attn 保底）。
// 結果在 window.__out。用法：desktop-app 資料夾 python -X utf8 -m http.server <埠> --bind 127.0.0.1，開 .../scripts/eval/o6_attn_batch_check.html
const mods = {};
const loadMod = async (key, url) => {
  const src = await (await fetch(url, { cache: 'no-store' })).text();
  const m = { exports: {} }; mods[key] = m;
  new Function('module', 'exports', 'require', src)(m, m.exports, (p) => { const k = p.replace(/^\.\//, '').replace(/\.js$/, ''); if (!mods[k]) throw new Error('missing ' + k); return mods[k].exports; });
};
let seed = 31;
const rnd = () => { seed = (Math.imul(seed, 1664525) + 1013904223) | 0; return (seed >>> 0) / 4294967296 - 0.5; };
(async () => {
  const out = { hardware: 'Kepler 14 W（同一台、同一瀏覽器）', cases: [], error: null };
  window.__out = out;
  try {
    await loadMod('gpu_core', '../../renderer/src/gpu/gpu_core.js');
    await loadMod('gpu_pool', '../../renderer/src/gpu/gpu_pool.js');
    await loadMod('nn_ops', '../../renderer/src/gpu/nn_ops.js');
    await loadMod('attn_ops', '../../renderer/src/gpu/attn_ops.js');
    await loadMod('attn_gpu', '../../renderer/src/gpu/attn_gpu.js');
    const nn = mods.nn_ops.exports, AG = mods.attn_gpu.exports, A = mods.attn_ops.exports;
    const { dev } = await nn.getDevice(navigator);
    let submits = 0;
    const realSubmit = dev.queue.submit.bind(dev.queue);
    dev.queue.submit = (cmds) => { submits++; return realSubmit(cmds); };
    const cases = [
      { name: 'decode S1 past512 H16 Hkv8 hd128（flash）', S: 1, past: 512, H: 16, Hkv: 8, hd: 128 },
      { name: 'prefill S16 past0 H8 Hkv8 hd64（flash）', S: 16, past: 0, H: 8, Hkv: 8, hd: 64 },
      { name: 'small S3 past5 H4 Hkv2 hd32（保底 attn）', S: 3, past: 5, H: 4, Hkv: 2, hd: 32 },
    ];
    for (const c of cases) {
      const { S, past, H, Hkv, hd } = c;
      const len = past + S;
      const q = Float32Array.from({ length: S * H * hd }, () => rnd());
      const k = Float32Array.from({ length: len * Hkv * hd }, () => rnd());
      const v = Float32Array.from({ length: len * Hkv * hd }, () => rnd());
      const cache = { k: k, v: v, hd: hd, Hkv: Hkv, len: len };
      const scale = 1 / Math.sqrt(hd);
      const ref = A.attnCore(q, S, past, cache, H, scale);
      submits = 0;
      const b = nn.createBatch(dev);
      const qh = b.upload(q), kh = b.upload(k), vh = b.upload(v);
      const yh = AG.attnCoreBatched(b, qh, kh, vh, S, past, H, Hkv, hd, scale, {});
      const [gy] = await b.read([[yh, S * H * hd]]);
      let maxAbs = 0, maxRef = 0;
      for (let i = 0; i < ref.length; i++) { maxAbs = Math.max(maxAbs, Math.abs(gy[i] - ref[i])); maxRef = Math.max(maxRef, Math.abs(ref[i])); }
      const rel = maxAbs / Math.max(maxRef, 1e-30);
      out.cases.push({ name: c.name, submits: submits, variant: AG.attnVariantFor(hd, {}), relErr: rel, pass: rel <= 1e-5 && submits === 1 });
    }
    out.allPass = out.cases.every((r) => r.pass);
  } catch (e) { out.error = String((e && e.stack) || e); }
  out.done = true;
})();
</script>
