<!doctype html><meta charset="utf-8"><title>r8 check</title>
<body style="font:13px monospace;white-space:pre">
<script>
// R1 原規格（真 Chrome、真 WebGPU，intel xe-lpg）：gpu_core 的暫存器分塊核心 mmR8Wgsl（kernel_gen 產生，16×16 執行緒、8×8 每執行緒、128×128 塊）
// 對 v4（mmTileWgslVec4，64×64 塊、vec4）。一次一個形狀：?M=&K=&N=&v=
// 正確性：對 mm_ops.matmulRef 相對誤差（判準 ≤1e-5）。
// 計時：與 r8_time.html 相同的方法（同一 submit 內 reps 次派發，onSubmittedWorkDone 停表，中位數）。只標 intel xe-lpg。
const mods = {};
const loadSrc = async (name) => (await fetch('../../renderer/src/gpu/' + name + '.js', { cache: 'no-store' })).text();
const relErr = (x, y) => { let mx = 0, sc = 1e-9; for (let i = 0; i < x.length; i++) { mx = Math.max(mx, Math.abs(x[i] - y[i])); sc = Math.max(sc, Math.abs(y[i])); } return mx / sc; };
(async () => {
  const q = new URLSearchParams(location.search);
  const M = +q.get('M'), K = +q.get('K'), N = +q.get('N'), reps = +(q.get('reps') || 6);
  const out = { shape: M + 'x' + K + 'x' + N, error: null, done: false };
  try {
    // kernel_gen（gpu_core 的 mmR8Wgsl 需要它）與 gpu_core
    const kg = { exports: {} };
    new Function('module', 'exports', 'require', await loadSrc('kernel_gen'))(kg, kg.exports, () => { throw new Error('kernel_gen require'); });
    const gc = { exports: {} };
    new Function('module', 'exports', 'require', await loadSrc('gpu_core'))(gc, gc.exports, (p) => { if (/kernel_gen/.test(p)) return kg.exports; throw new Error('require ' + p); });
    const core = gc.exports;
    // matmulRef：與 mm_ops 相同的 CPU 參考（f32 每步捨入，k 由小到大）
    const refMM = (A, B) => { const y = new Float32Array(M * N); for (let r = 0; r < M; r++) for (let c = 0; c < N; c++) { let acc = 0; for (let k = 0; k < K; k++) acc = Math.fround(acc + Math.fround(A[r * K + k] * B[k * N + c])); y[r * N + c] = acc; } return y; };
    const adapter = await navigator.gpu.requestAdapter();
    out.adapter = adapter.info && adapter.info.architecture;
    const dev = await adapter.requestDevice();
    const S = GPUBufferUsage.STORAGE, CD = GPUBufferUsage.COPY_DST, CS = GPUBufferUsage.COPY_SRC;
    let seed = 5; const rr = () => { seed = (Math.imul(seed, 1664525) + 1013904223) | 0; return (seed >>> 0) / 4294967296 - 0.5; };
    const A = Float32Array.from({ length: M * K }, rr), B = Float32Array.from({ length: K * N }, rr);
    const ref = refMM(A, B);
    const ab = dev.createBuffer({ size: M * K * 4, usage: S | CD }); dev.queue.writeBuffer(ab, 0, A);
    const bb = dev.createBuffer({ size: K * N * 4, usage: S | CD }); dev.queue.writeBuffer(bb, 0, B);
    const cb = dev.createBuffer({ size: M * N * 4, usage: S | CS });
    const ub = dev.createBuffer({ size: 32, usage: GPUBufferUsage.UNIFORM | CD }); dev.queue.writeBuffer(ub, 0, new Uint32Array([1, M, K, N, 1, 0, 0, 0]));
    const cands = {
      r8: [core.mmR8Wgsl({ marker: 'matmul_r8' }), core.mmR8Dispatch(M, N, 1)],
      v4: [core.mmTileWgslVec4({ marker: 'matmul_vec4' }), core.mmTileDispatch(M, N, 1)],
    };
    for (const [name, [code, grp]] of Object.entries(cands)) {
      const pipe = await dev.createComputePipelineAsync({ layout: 'auto', compute: { module: dev.createShaderModule({ code }), entryPoint: 'main' } });
      const bg = dev.createBindGroup({ layout: pipe.getBindGroupLayout(0), entries: [{ binding: 0, resource: { buffer: ab } }, { binding: 1, resource: { buffer: bb } }, { binding: 2, resource: { buffer: cb } }, { binding: 3, resource: { buffer: ub } }] });
      const once = (n) => { const enc = dev.createCommandEncoder(); const pass = enc.beginComputePass(); pass.setPipeline(pipe); pass.setBindGroup(0, bg); for (let i = 0; i < n; i++) pass.dispatchWorkgroups(grp[0], grp[1], grp[2]); pass.end(); dev.queue.submit([enc.finish()]); };
      // 正確性：單次派發後讀回
      once(1);
      const rb = dev.createBuffer({ size: M * N * 4, usage: GPUBufferUsage.MAP_READ | CD });
      const enc = dev.createCommandEncoder(); enc.copyBufferToBuffer(cb, 0, rb, 0, M * N * 4); dev.queue.submit([enc.finish()]);
      await rb.mapAsync(1); const y = new Float32Array(rb.getMappedRange().slice(0)); rb.unmap(); rb.destroy();
      out[name + '_relErr'] = relErr(y, ref);
      // 計時：reps 次派發放在同一個 submit，停表於 onSubmittedWorkDone，中位數（第 1 次暖機不算）
      const ts = [];
      for (let t = 0; t < reps + 1; t++) { const t0 = performance.now(); once(20); await dev.queue.onSubmittedWorkDone(); ts.push((performance.now() - t0) / 20); }
      ts.shift(); ts.sort((p, qq) => p - qq);
      out[name + '_ms_per_dispatch'] = Math.round(ts[Math.floor(ts.length / 2)] * 1000) / 1000;
    }
    out.r8_faster_than_v4 = out.r8_ms_per_dispatch < out.v4_ms_per_dispatch;
  } catch (e) { out.error = String((e && e.stack) || e).replace(/https?:\/\/\S+/g, 'URL').slice(0, 600); }
  out.done = true; window.__out = out; document.body.textContent = JSON.stringify(out, null, 1); document.title = 'done';
})();
</script>
