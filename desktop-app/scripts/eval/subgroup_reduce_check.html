<!doctype html><meta charset="utf-8"><title>subgroup reduce check</title>
<body style="font:13px monospace;white-space:pre">
<script>
// 子群組（subgroups）歸約變體的對拍（真 Chrome、真 WebGPU）。目的：確認 subgroupAdd 在這台可用，並與共用記憶體樹狀歸約比較正確性與時間。
// 核心：每個工作群組 256 個執行緒，各自讀一個元素，subgroupAdd 在子群組內加總，子群組總和寫入共用記憶體，最後由第一個子群組加總。
// 對照：同樣的工作，用共用記憶體樹狀歸約（無子群組）。
// 判準：每個區塊的和對 CPU 雙精度參考，相對誤差 ≤ 1e-5（兩種核心都是 f32，加法順序不同，不要求逐位相同）。
// 時間：端到端（上傳、派發、讀回），中位數 5 次，第 1 次暖機不算。只標這台。
// 這是測試用的獨立核心，不接入 kernel_select／production（那些檔案不在這頁的範圍）。
// 用法：desktop-app 資料夾 python -X utf8 -m http.server 8765 --bind 127.0.0.1，開 http://127.0.0.1:8765/scripts/eval/subgroup_reduce_check.html?v=1 ；結果在 window.__out。
const N_BLOCK = 256;
const WGSL_SUB = `enable subgroups;
@group(0) @binding(0) var<storage, read> x: array<f32>;
@group(0) @binding(1) var<storage, read_write> y: array<f32>;
var<workgroup> sh: array<f32, 64>;
@group(0) @binding(3) var<uniform> n: vec4<u32>;
@compute @workgroup_size(256)
fn main(@builtin(local_invocation_id) lid: vec3<u32>, @builtin(workgroup_id) wid: vec3<u32>,
        @builtin(subgroup_invocation_id) sid: u32, @builtin(subgroup_id) sgid: u32, @builtin(num_subgroups) nsg: u32) {
  let i = wid.x * 256u + lid.x;
  var v: f32 = 0.0;
  if (i < n.x) { v = x[i]; }
  let s = subgroupAdd(v);
  if (sid == 0u) { sh[sgid] = s; }
  workgroupBarrier();
  if (lid.x == 0u) {
    var t: f32 = 0.0;
    for (var k: u32 = 0u; k < nsg; k = k + 1u) { t = t + sh[k]; }
    y[wid.x] = t;
  }
}`;
const WGSL_TREE = `
@group(0) @binding(0) var<storage, read> x: array<f32>;
@group(0) @binding(1) var<storage, read_write> y: array<f32>;
var<workgroup> sh: array<f32, 256>;
@group(0) @binding(3) var<uniform> n: vec4<u32>;
@compute @workgroup_size(256)
fn main(@builtin(local_invocation_id) lid: vec3<u32>, @builtin(workgroup_id) wid: vec3<u32>) {
  let i = wid.x * 256u + lid.x;
  var v: f32 = 0.0;
  if (i < n.x) { v = x[i]; }
  sh[lid.x] = v;
  workgroupBarrier();
  var s: u32 = 128u;
  loop {
    if (s == 0u) { break; }
    if (lid.x < s) { sh[lid.x] = sh[lid.x] + sh[lid.x + s]; }
    workgroupBarrier();
    s = s >> 1u;
  }
  if (lid.x == 0u) { y[wid.x] = sh[0]; }
}`;
(async () => {
  const out = { adapter: null, device: null, correct: [], timing: [], allPass: false, error: null, done: false };
  try {
    const adapter = navigator.gpu && await navigator.gpu.requestAdapter();
    if (!adapter) throw new Error('沒有 WebGPU 介面卡');
    out.adapter = { vendor: adapter.info && adapter.info.vendor, arch: adapter.info && adapter.info.architecture, subgroups: adapter.features.has('subgroups'), f16: adapter.features.has('shader-f16'), maxWgStorage: adapter.limits.maxComputeWorkgroupStorageSize, maxInvocations: adapter.limits.maxComputeInvocationsPerWorkgroup };
    if (!adapter.features.has('subgroups')) throw new Error('介面卡沒有 subgroups 功能');
    const dev = await adapter.requestDevice({ requiredFeatures: ['subgroups'] });
    out.device = { subgroupMinMax: dev.adapterInfo ? null : null };
    const usage = { STORAGE: 0x0080, COPY_SRC: 0x0004, COPY_DST: 0x0008, UNIFORM: 0x0040, MAP_READ: 0x0001 };
    const mkBuf = (size, u) => dev.createBuffer({ size, usage: u });
    // 跑一次：x（Float32Array），回傳每個區塊的和（Float32Array）與耗時（端到端）
    const run = async (code, x, withSub) => {
      const nb = Math.ceil(x.length / N_BLOCK);
      const mod = dev.createShaderModule({ code });
      const pipe = await dev.createComputePipelineAsync({ layout: 'auto', compute: { module: mod, entryPoint: 'main' } });
      const t0 = performance.now();
      const xb = mkBuf(x.byteLength, usage.STORAGE | usage.COPY_DST);
      dev.queue.writeBuffer(xb, 0, x);
      const yb = mkBuf(nb * 4, usage.STORAGE | usage.COPY_SRC);
      const ub = mkBuf(16, usage.UNIFORM | usage.COPY_DST);
      dev.queue.writeBuffer(ub, 0, new Uint32Array([x.length, 0, 0, 0]));
      const bg = dev.createBindGroup({ layout: pipe.getBindGroupLayout(0), entries: [{ binding: 0, resource: { buffer: xb } }, { binding: 1, resource: { buffer: yb } }, { binding: 3, resource: { buffer: ub } }] });
      const rb = mkBuf(nb * 4, usage.MAP_READ | usage.COPY_DST);
      const enc = dev.createCommandEncoder();
      const pass = enc.beginComputePass(); pass.setPipeline(pipe); pass.setBindGroup(0, bg); pass.dispatchWorkgroups(nb); pass.end();
      enc.copyBufferToBuffer(yb, 0, rb, 0, nb * 4);
      dev.queue.submit([enc.finish()]);
      await rb.mapAsync(1);
      const res = new Float32Array(rb.getMappedRange().slice(0)); rb.unmap();
      const ms = performance.now() - t0;
      [xb, yb, ub, rb].forEach((b) => b.destroy());
      return { sums: res, ms };
    };
    // 正確性：幾個長度（含非 256 倍數與小於一個區塊）
    for (const n of [1, 37, 256, 300, 5000, 65536]) {
      let s = n * 7 + 1; const x = Float32Array.from({ length: n }, () => { s = (Math.imul(s, 1664525) + 1013904223) | 0; return (s >>> 0) / 4294967296 - 0.5; });
      const nb = Math.ceil(n / N_BLOCK), ref = new Float64Array(nb);
      for (let i = 0; i < n; i++) ref[Math.floor(i / N_BLOCK)] += x[i];
      const a = await run(WGSL_SUB, x, true), b = await run(WGSL_TREE, x, false);
      const rel = (got) => { let mx = 0, sc = 1e-9; for (let k = 0; k < nb; k++) { mx = Math.max(mx, Math.abs(got[k] - ref[k])); sc = Math.max(sc, Math.abs(ref[k])); } return mx / sc; };
      out.correct.push({ n, blocks: nb, subgroupRelErr: rel(a.sums), treeRelErr: rel(b.sums), pass: rel(a.sums) <= 1e-5 && rel(b.sums) <= 1e-5 });
    }
    // 時間：n = 4M（16 MB），端到端，中位數 5 次（第 1 次暖機）
    const N = 1 << 22;
    let s2 = 99; const big = Float32Array.from({ length: N }, () => { s2 = (Math.imul(s2, 1664525) + 1013904223) | 0; return (s2 >>> 0) / 4294967296 - 0.5; });
    const med = async (code, sub) => { await run(code, big, sub); const ts = []; for (let i = 0; i < 5; i++) ts.push((await run(code, big, sub)).ms); ts.sort((p, q) => p - q); return Math.round(ts[2] * 100) / 100; };
    out.timing.push({ n: N, subgroupMedianMs: await med(WGSL_SUB, true), treeMedianMs: await med(WGSL_TREE, false), note: '端到端（上傳 16 MB、派發、讀回），只標這台' });
    out.allPass = out.correct.every((c) => c.pass);
  } catch (e) { out.error = String((e && e.stack) || e).slice(0, 800); }
  out.done = true;
  window.__out = out;
  document.body.textContent = JSON.stringify(out, null, 1);
  document.title = 'done';
})();
</script>
