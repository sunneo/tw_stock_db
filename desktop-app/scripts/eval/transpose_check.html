<!doctype html><meta charset="utf-8"><title>transpose check</title>
<body style="font:13px monospace;white-space:pre">
<script>
// 真 Chrome（真 WebGPU）：轉置樣板 transpose（16×16 共用記憶體分塊）對 CPU 逐元素參考：應逐位相同。
// 並與 JS 純迴圈轉置同頁交錯量牆鐘（含上傳與讀回；兩邊都要把結果轉成陣列）。只標這台機器。結果在 window.__out。
const mods = {};
const loadMod = async (key, url) => {
  const src = await (await fetch(url, { cache: 'no-store' })).text();
  const m = { exports: {} }; mods[key] = m;
  new Function('module', 'exports', 'require', src)(m, m.exports, (p) => { const k = p.replace(/^\.\//, '').replace(/\.js$/, ''); if (!mods[k]) throw new Error('missing ' + k); return mods[k].exports; });
};
(async () => {
  const out = { correctness: [], timing: [], error: null };
  window.__out = out;
  try {
    await loadMod('gpu_core', '../../renderer/src/gpu/gpu_core.js');
    const core = mods.gpu_core.exports;
    const rt = core.createRuntime({ navigator: navigator, webgl2: null });
    let s = 3; const rnd = () => { s = (Math.imul(s, 1664525) + 1013904223) | 0; return ((s >>> 0) / 4294967296) - 0.5; };
    const cpuT = (A, m, n) => { const o = new Array(m * n); for (let i = 0; i < m; i++) for (let j = 0; j < n; j++) o[j * m + i] = A[i * n + j]; return o; };
    for (const [m, n] of [[5, 7], [33, 17], [64, 300], [1000, 1000], [4096, 512]]) {
      const A = Array.from({ length: m * n }, rnd);
      const ref = cpuT(Float32Array.from(A), m, n);
      const r = await rt.transpose(A, m, n);
      let mx = 0; for (let i = 0; i < ref.length; i++) mx = Math.max(mx, Math.abs(r.result[i] - ref[i]));
      out.correctness.push({ m, n, layer: r.info.layer, maxAbsDiff: mx, pass: r.info.layer === 'T1' && mx === 0 });
    }
    const med = (a) => { const b = a.slice().sort((p, q) => p - q); return Math.round(b[b.length >> 1] * 100) / 100; };
    for (const [m, n] of [[1000, 1000], [4096, 512], [2048, 2048]]) {
      const A = Array.from({ length: m * n }, rnd);
      await rt.transpose(A, m, n);
      const tG = [], tC = [];
      for (let i = 0; i < 5; i++) {
        let t0 = performance.now(); await rt.transpose(A, m, n); tG.push(performance.now() - t0);
        t0 = performance.now(); cpuT(A, m, n); tC.push(performance.now() - t0);
      }
      out.timing.push({ m, n, gpuWallMs: med(tG), jsLoopMs: med(tC) });
    }
  } catch (e) { out.error = String((e && e.stack) || e); }
  out.allPass = out.correctness.every((c) => c.pass);
  out.done = true;
  document.body.textContent = JSON.stringify(out, null, 1); document.title = 'done';
})();
</script>
