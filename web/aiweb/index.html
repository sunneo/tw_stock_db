<!DOCTYPE html>
<html lang="zh-Hant" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- 離線模型（Whisper、離線圖像轉文字）的多執行緒需要 SharedArrayBuffer：靜態網站不能設標頭，用 coi-serviceworker 取得 cross-origin isolated（?nocoi 可關閉） -->
<script src="../coi-serviceworker.js"></script>
<title>AI 助理</title>
<!-- 2026-11-15 冷載入優化：先建立到 jsDelivr 與 raw 的連線，並讓核心下載在這段 script 執行前就開始（網址與下方載入器一致）。 -->
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="preconnect" href="https://raw.githubusercontent.com" crossorigin>
<link rel="preload" as="fetch" crossorigin href="https://cdn.jsdelivr.net/gh/sunneo/tw_stock_db@5528d1c405bc273b8d105ce7239903b39f8424d3/desktop-app/web-lazy/core.js">
<style>
  :root {
    --bar-bg: #161b22; --bar-border: #30363d; --bar-fg: #cbd5e1;
    --btn-bg: #21262d; --btn-hover: #30363d; --page-bg: #0d1117;
  }
  html[data-theme="light"] {
    --bar-bg: #f3f4f6; --bar-border: #d1d5db; --bar-fg: #374151;
    --btn-bg: #ffffff; --btn-hover: #e5e7eb; --page-bg: #ffffff;
  }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: var(--page-bg);
    font-family: -apple-system, "Segoe UI", "Noto Sans TC", sans-serif;
    overflow: hidden;
  }
  body { display: flex; flex-direction: column; }
  #topbar {
    flex: 0 0 auto; display: flex; align-items: center; gap: 12px;
    padding: 6px 12px; padding-top: max(6px, env(safe-area-inset-top, 0px));
    background: var(--bar-bg); border-bottom: 1px solid var(--bar-border);
    color: var(--bar-fg); font-size: 12px;
  }
  #topbar .title { font-weight: 600; }
  #topbar .sep { flex: 1; }
  #topbar .badge { padding: 2px 8px; border-radius: 10px; background: var(--btn-bg); color: var(--bar-fg); }
  #topbar button, #topbar a.btn {
    background: var(--btn-bg); color: var(--bar-fg); border: 1px solid var(--bar-border);
    border-radius: 6px; padding: 3px 10px; cursor: pointer; font-size: 12px; text-decoration: none;
  }
  #topbar button:hover, #topbar a.btn:hover { background: var(--btn-hover); }
  /* mount元素一定要有inline style="display:block"，否則floating-assistant.js
     會套用預設的inline-flex，寬度縮成剛好包住內容而不是撐滿（桌面版踩過的坑）。 */
  #app { flex: 1 1 auto; min-height: 0; width: 100%; padding-bottom: env(safe-area-inset-bottom, 0px); }
  /* 這頁本來就該一直展開，❌ 關閉鈕點下去只會收合、整頁變空白，隱藏（主頁、桌面版同作法） */
  #ai-btn-close { display: none !important; }
  #load-error { padding: 16px; color: #f87171; font-size: 14px; }
  /* 2026-11-15 冷載入優化：核心下載完成前顯示的骨架（標題、對話區、輸入框、進度條）；核心就緒時整段移除，換成真介面。 */
  #fa-skeleton { padding: 12px 16px; color: var(--bar-fg, #cbd5e1); }
  #fa-skeleton .sk-title { height: 22px; width: 160px; border-radius: 6px; background: var(--btn-bg, #21262d); margin-bottom: 14px; }
  #fa-skeleton .sk-chat { height: 40vh; border-radius: 10px; background: var(--btn-bg, #21262d); margin-bottom: 12px; }
  #fa-skeleton .sk-input { height: 44px; border-radius: 10px; border: 1px solid var(--bar-border, #30363d); background: var(--page-bg, #0d1117); }
  #fa-skeleton .sk-progress { margin-top: 12px; height: 4px; border-radius: 2px; background: var(--bar-border, #30363d); overflow: hidden; }
  #fa-skeleton .sk-progress > i { display: block; height: 100%; width: 0; background: #58a6ff; transition: width .2s; }
  #fa-skeleton .sk-text { font-size: 13px; margin-top: 6px; opacity: .8; }
</style>
</head>
<body>
  <div id="topbar">
    <span class="title">🤖 AI 助理</span>
    <span class="sep"></span>
    <span id="status" class="badge">載入 AI 引擎中…</span>
    <button type="button" id="theme-toggle" title="切換淺色／深色主題">🌙 深色</button>
    <!-- tw_stock_db客製: 2026-09-26使用者要求——網頁版右上角要有「取得桌面版」的
         連結。預設先指到GitHub Releases頁（安全的後備連結，純HTML屬性、
         不依賴任何JS，就算下面的偵測腳本或floating-assistant.js都載入
         失敗，這顆按鈕仍然看得到、按得到，使用者自己在release頁挑檔案）；
         下面的detectDesktopAppAsset()腳本會盡力把href換成「依作業系統
         判斷出來的、當下最新release的確切安裝檔」直接下載連結（見該腳本
         說明），失敗就維持這個後備連結不變。 -->
    <a class="btn" id="get-desktop-app" href="https://github.com/sunneo/tw_stock_db/releases" target="_blank" rel="noopener noreferrer" title="下載桌面版 FloatingAssistant（Windows／Linux 安裝檔）">💻 取得 Desktop App</a>
  </div>
  <div id="app" style="display:block;"><div id="fa-skeleton" aria-live="polite"><div class="sk-title"></div><div class="sk-chat"></div><div class="sk-input"></div><div class="sk-progress"><i id="fa-sk-bar"></i></div><div class="sk-text" id="fa-sk-text">載入 AI 引擎中…</div></div></div>

<script>
'use strict';
/* tw_stock_db客製: 2026-09-26使用者要求——「取得 Desktop App」按鈕要依
   訪客的作業系統，直接連到「當下最新一個release」對應的安裝檔（不要寫死
   版本號，之後每次發新版release，這裡都不用跟著改）。electron-builder的
   artifactName預設會把版本號嵌進檔名（例如FloatingAssistant.Setup.0.1.0.exe、
   FloatingAssistant-0.1.0.AppImage），沒辦法用GitHub提供的
   `releases/latest/download/<固定檔名>`這個免API捷徑（那個捷徑要求檔名
   在每次release都完全一樣）——改成呼叫GitHub REST API的
   `/releases/latest`（公開repo的唯讀GET請求不需要認證，GitHub本身有開
   Access-Control-Allow-Origin: *，瀏覽器端直接fetch即可，不需要經過
   worker/proxy），拿到最新release實際的assets清單，依副檔名(.exe／
   .AppImage)配對出對應這次作業系統的真正下載連結。這段刻意跟下面載入
   floating-assistant.js那整段完全獨立（不共用任何函式、不依賴AI引擎
   是否載入成功）——即使GitHub API呼叫失敗（額度用完、離線等），
   <a id="get-desktop-app">本來就有寫死的靜態href（連到releases首頁），
   使用者退而求其次還是找得到下載頁，不會完全連不到任何東西。 */
function detectDesktopAppAsset() {
  var link = document.getElementById('get-desktop-app');
  if (!link) return;
  var ua = navigator.userAgent || '';
  var platform = navigator.platform || '';
  var isWindows = /Win/i.test(ua) || /Win/i.test(platform);
  // navigator.userAgent在ChromeOS/Android等其他平台也可能含"Linux"，這裡
  // 明確排除Android；ChromeOS沒有對應安裝檔，落到下面「未偵測到支援平台」
  // 的分支，保留原本的releases首頁連結，不會亂配一個不能用的檔案。
  var isLinux = /Linux/i.test(ua) && !/Android/i.test(ua);
  if (!isWindows && !isLinux) return; // 不支援的平台（macOS/其他）：維持原本releases首頁連結

  // 2026-11-15 冷載入優化：這個查詢不在開機路徑上。結果存 localStorage 24 小時（有快取就直接套用、不重查），
  // 沒快取才在瀏覽器閒置時（requestIdleCallback，逾時 4 秒；沒有就 2 秒後）才打 GitHub API。
  // localStorage 不可用（隱私模式）就照舊每次查，失敗一律保留 releases 首頁連結。
  var CACHE_KEY = 'fa-desktop-asset-v1';
  var TTL_MS = 24 * 60 * 60 * 1000;
  var pattern = isWindows ? /\.exe$/i : /\.AppImage$/i;
  function apply(info) {
    link.href = info.href;
    link.title = info.title;
    link.textContent = isWindows ? '💻 下載 Desktop App（Windows）' : '💻 下載 Desktop App（Linux）';
  }
  function readCache() {
    try { var c = JSON.parse(localStorage.getItem(CACHE_KEY) || 'null'); return c && c.platform === (isWindows ? 'win' : 'linux') ? c : null; } catch (_) { return null; }
  }
  function writeCache(info) {
    try { localStorage.setItem(CACHE_KEY, JSON.stringify(info)); } catch (_) { /* 隱私模式等情況下不快取 */ }
  }
  var cached = readCache();
  if (cached && cached.href && Date.now() - cached.t < TTL_MS) { apply(cached); return; }
  function query() {
    fetch('https://api.github.com/repos/sunneo/tw_stock_db/releases/latest')
      .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(function (release) {
        var assets = (release && release.assets) || [];
        var asset = assets.find(function (a) { return pattern.test(a.name || ''); });
        if (!asset) return; // 這個release沒有對應平台的安裝檔，維持原本releases首頁連結
        var info = {
          t: Date.now(),
          platform: isWindows ? 'win' : 'linux',
          href: asset.browser_download_url,
          title: '下載 ' + asset.name + '（' + (release.tag_name || '最新版') + '）'
        };
        writeCache(info);
        apply(info);
      })
      .catch(function () { /* 保留原本寫死的releases首頁連結，不用另外提示錯誤 */ });
  }
  if (typeof requestIdleCallback === 'function') requestIdleCallback(query, { timeout: 4000 });
  else setTimeout(query, 2000);
}
</script>

<script>
'use strict';
/* aiweb：整頁都是 floating-assistant 的獨立入口，不載入任何股市資料
   （不碰 sql.js／DBMgr／GitHub 上的 daily、db-monthly 等分支），
   只為了「想測試、使用 AI 但不想等股票資料下載」。
   版面比照桌面版（desktop-app/renderer/index.html）：上方一條 topbar，
   下面 #app 撐滿。AI 引擎本身跟主頁一樣，從 desktop-app 分支即時抓取。 */

const RAW = 'https://raw.githubusercontent.com/sunneo/tw_stock_db';
const VENDOR = RAW + '/vendor-assets/vendor';
const WORKER_BASE = 'https://dawn-disk-778c.sunneo529.workers.dev';
const THEME_KEY = 'fa_aiweb_theme_preference';

// ---- 主題：在 new FloatingAssistant 之前先套用，避免畫面出現後才換色閃爍 ----
const themeBtn = document.getElementById('theme-toggle');
function applyTheme(theme) {
  document.documentElement.setAttribute('data-theme', theme);
  themeBtn.textContent = theme === 'light' ? '☀️ 淺色' : '🌙 深色';
}
function readSavedTheme() {
  try { return localStorage.getItem(THEME_KEY) === 'light' ? 'light' : 'dark'; }
  catch (_) { return 'dark'; }
}
applyTheme(readSavedTheme());

// ---- 跟主頁一樣：沒填過自己的金鑰就預填 worker 代打用的 session 金鑰 ----
// 用同樣的 localStorage key，主頁跟 aiweb（同一個 origin）共用同一份 AI 設定。
try {
  if (!localStorage.getItem('floating_ai_api_key')) {
    let sid = localStorage.getItem('tw_stock_db_ai_session_id');
    if (!sid) { sid = crypto.randomUUID(); localStorage.setItem('tw_stock_db_ai_session_id', sid); }
    localStorage.setItem('floating_ai_api_key', `tw_stock_db_api:${sid}`);
  }
  if (!localStorage.getItem('floating_ai_base_url_key')) {
    localStorage.setItem('floating_ai_base_url_key', WORKER_BASE);
  }
} catch (_) { /* 隱私模式等情況下 localStorage 不可用，仍可使用 AI 設定面板手動填 */ }

/// ---- 載入 floating-assistant.js（2026-11-15 冷載入優化）----
// 與 web/index.html 同一套：jsDelivr 釘 SHA 優先、raw 退路。8 秒逾時只限「連線與回應標頭」：
// 8 秒內拿不到回應就換下一個來源。回應開始後不設逾時（慢網路下完整下載 2 MB 核心可能超過 8 秒，不應換來源），
// 中途斷線由瀏覽器回報錯誤。失敗寫 console.warn（檔名、來源、錯誤、耗時）。
// 核心下載時更新骨架進度（分母 = 解壓後的核心位元組數，來自 boot.json 的 coreBytes）；
// 開機區塊（boot.json 的 names）並行預抓進 window.__FA_PREFETCH，核心執行時直接用，不再同步 XHR 逐一載入。
var FA_SHA = '5528d1c405bc273b8d105ce7239903b39f8424d3';
var FA_JSD = 'https://cdn.jsdelivr.net/gh/sunneo/tw_stock_db@' + FA_SHA + '/desktop-app/web-lazy/';
var FA_RAWB = RAW + '/' + FA_SHA + '/desktop-app/web-lazy/';
var FA_ROOTS = [FA_JSD, FA_RAWB];
var FA_TIMEOUT_MS = 8000;
window.__FA_LAZY_BASES = [FA_JSD + 'chunks/', FA_RAWB + 'chunks/'];
// 舊核心只認 __FA_LAZY_BASE、沒有退路，維持 raw（與改版前相同）；新核心認得 __FA_LAZY_BASES（jsDelivr 優先）。
window.__FA_LAZY_BASE = FA_RAWB + 'chunks/';
window.__FA_PREFETCH = {};
function faSetProgress(pct, text) {
  var bar = document.getElementById('fa-sk-bar');
  if (bar) bar.style.width = Math.max(0, Math.min(100, pct)) + '%';
  var t = document.getElementById('fa-sk-text');
  if (t && text) t.textContent = text;
  var st = document.getElementById('status');
  if (st && text) st.textContent = text;
}
// 讀取回應本文；有串流就逐塊讀並回報已收到的解壓後位元組數（onChunk(已收到)）。沒有串流就整包 text()。
function faReadBody(r, onChunk) {
  if (!r.body || !r.body.getReader) return r.text();
  var reader = r.body.getReader(); var parts = []; var got = 0;
  function pump() {
    return reader.read().then(function (x) {
      if (x.done) return;
      parts.push(x.value); got += x.value.length;
      if (onChunk) onChunk(got);
      return pump();
    });
  }
  return pump().then(function () {
    var all = new Uint8Array(got); var o = 0;
    parts.forEach(function (p) { all.set(p, o); o += p.length; });
    return new TextDecoder('utf-8').decode(all);
  });
}
// 依序嘗試 jsDelivr → raw。8 秒內沒有回應標頭就換來源；失敗寫 console.warn 並換下一個來源。
function faFetchFirst(rel, onChunk) {
  var i = 0;
  function attempt() {
    var root = FA_ROOTS[i];
    var t0 = performance.now();
    var ctl = typeof AbortController !== 'undefined' ? new AbortController() : null;
    var headersTimer = ctl ? setTimeout(function () { ctl.abort(); }, FA_TIMEOUT_MS) : null;
    return fetch(root + rel, ctl ? { signal: ctl.signal } : undefined)
      .then(function (r) {
        clearTimeout(headersTimer);
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return faReadBody(r, onChunk);
      })
      .then(function (text) { clearTimeout(headersTimer); return { text: text, source: root }; }, function (e) {
        clearTimeout(headersTimer);
        var msg = (e && e.name === 'AbortError') ? '連線 ' + (FA_TIMEOUT_MS / 1000) + ' 秒內沒有回應' : ((e && e.message) || String(e));
        console.warn('[網頁版載入] ' + rel + ' 從 ' + root + ' 失敗：' + msg + '，耗時 ' + Math.round(performance.now() - t0) + ' 毫秒' + (i + 1 < FA_ROOTS.length ? '，改用下一個來源' : '，已無退路'));
        if (++i < FA_ROOTS.length) return attempt();
        throw e;
      });
  }
  return attempt();
}
function loadAssistantScript() {
  var bootP = faFetchFirst('boot.json').then(function (x) { return JSON.parse(x.text); }, function () { return null; });
  var coreP = faFetchFirst('core.js', function (got) {
    var total = window.__faCoreBytes || 0;
    if (total > 0) {
      var pct = Math.min(99, Math.round(got / total * 100));
      faSetProgress(pct, '載入核心 ' + pct + '%');
    } else {
      faSetProgress(0, '載入核心中…（已收到 ' + (got / 1048576).toFixed(1) + ' MB）');
    }
  });
  return Promise.all([coreP, bootP]).then(function (res) {
    var b = res[1];
    var names = Array.isArray(b) ? b : (b && Array.isArray(b.names) ? b.names : []);
    if (b && typeof b.coreBytes === 'number') window.__faCoreBytes = b.coreBytes;
    var done = 0;
    if (names.length) faSetProgress(0, '載入分塊 0/' + names.length);
    return Promise.all(names.map(function (n) {
      return faFetchFirst('chunks/' + n + '.js').then(function (x) { window.__FA_PREFETCH[n] = x.text; }, function () { /* 沒預抓到，核心會同步載入 */ })
        .then(function () { done++; faSetProgress(100 * done / names.length, '載入分塊 ' + done + '/' + names.length); });
    })).then(function () { return res[0].text; });
  }).then(text => new Promise((resolve, reject) => {
    const url = URL.createObjectURL(new Blob([text], { type: 'application/javascript' }));
    const s = document.createElement('script');
    s.src = url;
    s.onload = () => { URL.revokeObjectURL(url); resolve(); };
    s.onerror = () => { URL.revokeObjectURL(url); reject(new Error('floating-assistant.js 執行失敗')); };
    document.head.appendChild(s);
  }));
}

function showError(msg) {
  document.getElementById('status').textContent = '載入失敗';
  document.getElementById('app').innerHTML =
    `<div id="load-error">AI 引擎載入失敗：${String(msg).replace(/[<>&]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]))}<br>可能是網路問題，請<a href="" onclick="location.reload();return false;">重新整理</a>再試。</div>`;
}

loadAssistantScript().then(() => {
  if (typeof FloatingAssistant === 'undefined') throw new Error('FloatingAssistant 未定義');
  if (FloatingAssistant.setAssetUrls) {
    // 匯出 PPTX/PDF 等用的外部函式庫，改用 repo 自己 vendor 的版本（同主頁）。
    FloatingAssistant.setAssetUrls({
      pptxgenjs: `${VENDOR}/pptxgenjs/pptxgen.bundle.js`,
      pdfmake: `${VENDOR}/pdfmake/pdfmake.min.js`,
      pdfmakeFonts: `${VENDOR}/pdfmake/vfs_fonts.js`,
      cjkFontRegular: `${VENDOR}/fonts-noto-sans-tc/chinese-traditional-400-normal.ttf`,
      cjkFontBold: `${VENDOR}/fonts-noto-sans-tc/chinese-traditional-700-normal.ttf`,
      marked: `${VENDOR}/marked/marked.min.js`,
      dompurify: `${VENDOR}/dompurify/purify.min.js`,
      katexJs: `${VENDOR}/katex/katex.min.js`,
      katexCss: `${VENDOR}/katex/katex.min.css`,
      jszip: `${VENDOR}/jszip/jszip.min.js`,
      threejs: `${VENDOR}/three/three.min.js`,
      threeOrbitControls: `${VENDOR}/three/OrbitControls.js`,
      threeSTLLoader: `${VENDOR}/three/STLLoader.js`,
      threeOBJLoader: `${VENDOR}/three/OBJLoader.js`,
      three3MFLoader: `${VENDOR}/three/3MFLoader.js`,
      threeFBXLoader: `${VENDOR}/three/FBXLoader.js`,
      threeFflate: `${VENDOR}/three/fflate.min.js`,
    });
  }

  // 2026-11-15：核心就緒，骨架換成真介面（FloatingAssistant 同步建好 UI，不會閃一下）
  var skel = document.getElementById('fa-skeleton'); if (skel) skel.remove();
  faSetProgress(100, '載入 AI 引擎完成');
  const fa = new FloatingAssistant({
    mountSelector: '#app',
    buttonStyle: 'display:none;',
    windowStyle: 'position:static; width:100%; height:100%; max-height:none; box-shadow:none; border-radius:0; z-index:1;',
    // 左邊可收合、可分群組的對話清單（每個對話各有訊息，存在瀏覽器persistentStorage）。台股頁（web/index.html）不開。
    chatList: true,
  });
  window.fa = fa;
  // 2026-11-15：桌面版下載連結的 GitHub 查詢移到就緒之後（閒置時才查，見 detectDesktopAppAsset）
  detectDesktopAppAsset(); // 方便除錯；正式功能不依賴這個全域變數
  fa.toggleWindow(); // 這頁本來就該一直展開

  themeBtn.addEventListener('click', () => {
    const next = document.documentElement.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
    try { localStorage.setItem(THEME_KEY, next); } catch (_) {}
    applyTheme(next);
    fa.refreshTheme(); // 已建立的聊天面板節點需要主動重新套色
  });

  document.getElementById('status').textContent = '就緒';
