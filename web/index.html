<!DOCTYPE html>
<html lang="zh-TW" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>台股追蹤</title>

<!-- PWA / 加到主畫面後可全螢幕（無網址列）啟動，見 manifest.webmanifest -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="台股追蹤">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0d1117" media="(prefers-color-scheme: dark)">

<style>
/* ── Reset ── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
/* 100dvh（dynamic viewport height）會隨手機瀏覽器網址列顯示/隱藏即時調整，
   比 100vh 在手機上更不會被網址列擋住或留白；不支援的舊瀏覽器自動退回 100%。 */
html, body { height: 100%; height: 100dvh; overflow: hidden; }

/* ── Theme tokens ── */
:root {
  --bg0: #f8f9fa;
  --bg1: #ffffff;
  --bg2: #f0f1f3;
  --bg3: #e4e6ea;
  --txt0: #1a1a2e;
  --txt1: #374151;
  --txt2: #6b7280;
  --bdr:  #d1d5db;
  --acc:  #2563eb;
  --acc2: #dbeafe;
  --up:   #dc2626;   /* 漲 = 紅 */
  --dn:   #16a34a;   /* 跌 = 綠 */
  --shd:  0 2px 8px rgba(0,0,0,.10);
  --shd2: 0 4px 16px rgba(0,0,0,.14);
  --sel:  #dbeafe;
}
[data-theme="dark"] {
  --bg0: #0d1117;
  --bg1: #161b22;
  --bg2: #21262d;
  --bg3: #30363d;
  --txt0: #e6edf3;
  --txt1: #c9d1d9;
  --txt2: #8b949e;
  --bdr:  #30363d;
  --acc:  #58a6ff;
  --acc2: #1a3a5e;
  --up:   #f87171;
  --dn:   #4ade80;
  --shd:  0 2px 8px rgba(0,0,0,.40);
  --shd2: 0 4px 16px rgba(0,0,0,.55);
  --sel:  #1a3a5e;
}

/* ── Layout ── */
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans TC', sans-serif;
  background: var(--bg0);
  color: var(--txt0);
  display: flex;
  flex-direction: column;
  height: 100%;
}

/* ── Navbar ── */
#navbar {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 6px 10px;
  background: var(--bg1);
  border-bottom: 1px solid var(--bdr);
  flex-shrink: 0;
  position: relative;
  z-index: 200;
  height: 44px;
}
.brand { font-weight: 700; font-size: 15px; color: var(--acc); white-space: nowrap; }
.spacer { flex: 1; }

/* ── Buttons ── */
.btn {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 4px 10px;
  border: 1px solid var(--bdr);
  border-radius: 6px;
  background: var(--bg2);
  color: var(--txt0);
  font-size: 13px;
  cursor: pointer;
  transition: background .15s, border-color .15s;
  white-space: nowrap;
}
.btn:hover { background: var(--bg3); }
.btn:disabled { opacity: .4; cursor: default; }
.btn.icon { padding: 4px 8px; }
.btn.primary { background: var(--acc); color: #fff; border-color: var(--acc); }
.btn.primary:hover { opacity: .88; }

/* ── Menu dropdown ── */
.menu-wrap { position: relative; }
#menu-drop {
  position: absolute;
  top: calc(100% + 4px);
  left: 0;
  min-width: 140px;
  background: var(--bg1);
  border: 1px solid var(--bdr);
  border-radius: 8px;
  box-shadow: var(--shd2);
  overflow: hidden;
  z-index: 999;
}
#menu-drop.hidden { display: none; }
.menu-item {
  padding: 9px 14px;
  cursor: pointer;
  font-size: 13px;
  color: var(--txt0);
  transition: background .12s;
}
.menu-item:hover { background: var(--bg3); }

/* ── Main container ── */
#main {
  display: flex;
  flex: 1;
  overflow: hidden;
}

/* ── Sidebar ── */
#sidebar {
  display: flex;
  flex-direction: column;
  width: 280px;
  min-width: 220px;
  max-width: 380px;
  flex-shrink: 0;
  border-right: 1px solid var(--bdr);
  background: var(--bg1);
  overflow: hidden;
}
#sidebar-top {
  padding: 8px;
  border-bottom: 1px solid var(--bdr);
  display: flex;
  flex-direction: column;
  gap: 6px;
  flex-shrink: 0;
}
select {
  width: 100%;
  padding: 5px 8px;
  border: 1px solid var(--bdr);
  border-radius: 6px;
  background: var(--bg2);
  color: var(--txt0);
  font-size: 13px;
  cursor: pointer;
}
select:focus { outline: 2px solid var(--acc); }

/* watchlist controls */
#wl-bar { display: flex; gap: 4px; }
#wl-input {
  flex: 1;
  padding: 5px 8px;
  border: 1px solid var(--bdr);
  border-radius: 6px;
  background: var(--bg2);
  color: var(--txt0);
  font-size: 13px;
}
#wl-input:focus { outline: 2px solid var(--acc); }

/* ── Stock list ── */
#stock-list-wrap {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
}
#stock-list-wrap::-webkit-scrollbar { width: 5px; }
#stock-list-wrap::-webkit-scrollbar-thumb { background: var(--bdr); border-radius: 3px; }
#stock-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 12px;
}
#stock-table thead th {
  position: sticky;
  top: 0;
  background: var(--bg2);
  color: var(--txt2);
  font-weight: 600;
  padding: 5px 4px;
  text-align: right;
  border-bottom: 1px solid var(--bdr);
  white-space: nowrap;
}
#stock-table thead th:first-child { text-align: left; }
#stock-table tbody tr {
  border-bottom: 1px solid var(--bdr);
  cursor: pointer;
  transition: background .1s;
}
#stock-table tbody tr:hover { background: var(--bg2); }
#stock-table tbody tr.selected { background: var(--sel); }
#stock-table tbody tr.drag-over { border-top: 2px solid var(--acc); }
#stock-table td {
  padding: 5px 4px;
  text-align: right;
  white-space: nowrap;
  vertical-align: middle;
}
#stock-table td:first-child { text-align: left; }
.td-code { font-weight: 600; color: var(--acc); }
.td-name { max-width: 60px; overflow: hidden; text-overflow: ellipsis; text-align: left; color: var(--txt1); }
.td-up { color: var(--up); }
.td-dn { color: var(--dn); }
.td-flat { color: var(--txt2); }
.td-spark { text-align: center; }
.del-btn {
  padding: 1px 5px;
  font-size: 11px;
  border: 1px solid var(--bdr);
  border-radius: 4px;
  background: transparent;
  color: var(--txt2);
  cursor: pointer;
}
.del-btn:hover { background: #fee2e2; color: #dc2626; border-color: #dc2626; }

/* empty state */
.empty-hint {
  padding: 24px;
  text-align: center;
  color: var(--txt2);
  font-size: 13px;
}

/* ── Paginator ── */
#paginator {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 6px 8px;
  border-top: 1px solid var(--bdr);
  flex-shrink: 0;
  gap: 6px;
}
#page-info { font-size: 12px; color: var(--txt2); white-space: nowrap; }

/* ── Chart area ── */
#chart-area {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  background: var(--bg0);
}
#chart-header {
  padding: 8px 12px;
  border-bottom: 1px solid var(--bdr);
  background: var(--bg1);
  flex-shrink: 0;
  display: flex;
  align-items: center;
  gap: 12px;
  min-height: 38px;
}
#chart-title { font-size: 14px; font-weight: 700; color: var(--txt0); }
#chart-info  { font-size: 12px; color: var(--txt2); }
#chart-fetch-hint { font-size: 11px; color: var(--acc); font-style: italic; }
#chart-wrap  { flex: 1; position: relative; overflow: hidden; }
#main-chart  { display: block; cursor: crosshair; }

/* ── Loading overlay ── */
#loading {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.6);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 9999;
}
#loading.hidden { display: none; }
#loading-box {
  background: var(--bg1);
  border-radius: 12px;
  padding: 28px 32px;
  width: 380px;
  max-width: 92vw;
  box-shadow: var(--shd2);
}
#loading-title { font-size: 16px; font-weight: 700; margin-bottom: 12px; color: var(--txt0); }
#loading-msg   { font-size: 13px; color: var(--txt1); margin-bottom: 10px; min-height: 18px; }
#loading-bar-wrap {
  height: 8px;
  background: var(--bg3);
  border-radius: 4px;
  overflow: hidden;
  margin-bottom: 8px;
}
#loading-bar { height: 100%; background: var(--acc); border-radius: 4px; transition: width .2s; width: 0%; }
#loading-sub  { font-size: 11px; color: var(--txt2); min-height: 16px; }
#loading-err  { font-size: 12px; color: #dc2626; margin-top: 8px; display: none; }
#loading-retry { margin-top: 12px; display: none; }

/* ── Resize handle ── */
#resize-handle {
  width: 4px;
  background: transparent;
  cursor: col-resize;
  flex-shrink: 0;
  transition: background .15s;
}
#resize-handle:hover, #resize-handle.dragging { background: var(--acc); }

/* ── Scrollbar global ── */
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--bdr); border-radius: 3px; }

/* ── Strong-stock filter bar ── */
#strong-bar { display: flex; flex-direction: column; gap: 6px; }
#strong-status { font-size: 11px; color: var(--txt2); min-height: 14px; }

/* ── Chart toolbar ── */
.chart-toolbar { display: flex; align-items: center; gap: 6px; margin-left: auto; flex-wrap: wrap; }
.seg-group { display: flex; border: 1px solid var(--bdr); border-radius: 6px; overflow: hidden; }
.seg-btn {
  padding: 4px 9px;
  font-size: 12px;
  background: var(--bg2);
  border: none;
  border-right: 1px solid var(--bdr);
  cursor: pointer;
  color: var(--txt1);
}
.seg-btn:last-child { border-right: none; }
.seg-btn.active { background: var(--acc); color: #fff; }
.seg-btn:hover:not(.active) { background: var(--bg3); }

/* ── Settings modal (Eclipse-style categorized preferences) ── */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.5);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 500;
}
.modal-overlay.hidden { display: none; }
.modal-box {
  width: 480px;
  max-width: 92vw;
  background: var(--bg1);
  border-radius: 10px;
  box-shadow: var(--shd2);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.modal-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 14px;
  border-bottom: 1px solid var(--bdr);
  font-weight: 700;
  font-size: 14px;
}
.modal-body { display: flex; height: 280px; }
.modal-sidebar {
  width: 150px;
  flex-shrink: 0;
  border-right: 1px solid var(--bdr);
  background: var(--bg2);
  overflow-y: auto;
}
.modal-cat {
  padding: 10px 12px;
  font-size: 13px;
  cursor: pointer;
  color: var(--txt1);
  border-left: 3px solid transparent;
}
.modal-cat:hover { background: var(--bg3); }
.modal-cat.active { background: var(--sel); border-left-color: var(--acc); color: var(--txt0); font-weight: 600; }
.modal-content { flex: 1; padding: 14px 16px; overflow-y: auto; }
.modal-pane.hidden { display: none; }
.modal-pane h3 { font-size: 12px; color: var(--txt2); margin: 12px 0 8px; }
.modal-pane h3:first-child { margin-top: 0; }
.modal-pane label {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  font-size: 13px;
  color: var(--txt1);
  margin-bottom: 10px;
}
.modal-pane input[type="number"] {
  width: 90px;
  padding: 4px 6px;
  border: 1px solid var(--bdr);
  border-radius: 6px;
  background: var(--bg2);
  color: var(--txt0);
  font-size: 13px;
  text-align: right;
}
.modal-footer {
  display: flex;
  justify-content: flex-end;
  gap: 8px;
  padding: 10px 14px;
  border-top: 1px solid var(--bdr);
}

/* ── Hidden utility ── */
.hidden { display: none !important; }

/* ════════════════════════════════════════
   MOBILE TAB BAR (portrait compact only — see media query below)
   ════════════════════════════════════════ */
#mobile-tabbar { display: none; }
.mtab-btn {
  flex: 1;
  padding: 10px 4px;
  text-align: center;
  font-size: 14px;
  font-weight: 600;
  color: var(--txt2);
  background: var(--bg1);
  border: none;
  border-bottom: 2px solid transparent;
  cursor: pointer;
}
.mtab-btn.active { color: var(--acc); border-bottom-color: var(--acc); }

/* ── Drawer (landscape compact only) ── */
#drawer-toggle-btn { display: none; }
#drawer-overlay { display: none; }

/* ════════════════════════════════════════
   RESPONSIVE — compact PORTRAIT (phone/tablet, <1024px, portrait):
   list ⇄ chart become tab-switched full-screen panels, one at a time.
   ════════════════════════════════════════ */
@media (max-width: 1023px) and (orientation: portrait) {
  #mobile-tabbar { display: flex; flex-shrink: 0; border-bottom: 1px solid var(--bdr); }
  #resize-handle { display: none; }

  #main { flex-direction: column; }
  #sidebar {
    width: 100% !important; max-width: none; min-width: 0;
    border-right: none;
  }
  #sidebar, #chart-area { display: none; }
  #main.show-list #sidebar { display: flex; flex: 1; }
  #main.show-chart #chart-area { display: flex; flex: 1; }

  /* larger tap targets on touch screens */
  .btn, select, #stock-table tbody tr, .seg-btn { min-height: 34px; }
  #stock-table td, #stock-table th { padding: 8px 6px; }
}

/* ════════════════════════════════════════
   RESPONSIVE — compact LANDSCAPE (phone/tablet, <1024px, landscape):
   chart takes the full screen; the stock list becomes an off-canvas drawer.
   ════════════════════════════════════════ */
@media (max-width: 1023px) and (orientation: landscape) {
  #resize-handle { display: none; }
  #drawer-toggle-btn { display: inline-flex; }

  #sidebar {
    position: fixed;
    top: 44px; left: 0; bottom: 0;
    width: min(78vw, 320px); max-width: none; min-width: 0;
    z-index: 300;
    transform: translateX(-100%);
    transition: transform .22s ease;
    box-shadow: var(--shd2);
  }
  #main.drawer-open #sidebar { transform: translateX(0); }

  #drawer-overlay {
    position: fixed;
    top: 44px; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,.4);
    z-index: 290;
  }
  #main.drawer-open #drawer-overlay { display: block; }

  .btn, select, #stock-table tbody tr, .seg-btn { min-height: 34px; }
}

/* very small phones: trim some padding/gaps so the chart toolbar still fits */
@media (max-width: 380px) {
  .chart-toolbar { gap: 4px; }
  .seg-btn { padding: 4px 6px; font-size: 11px; }
  #chart-title { font-size: 13px; }
}
</style>
</head>
<body>

<!-- ══ NAVBAR ══ -->
<nav id="navbar">
  <div class="menu-wrap">
    <button class="btn icon" id="menu-btn" title="選單">☰</button>
    <div id="menu-drop" class="hidden">
      <div class="menu-item" data-act="new">📄 新增設定</div>
      <div class="menu-item" data-act="open">📂 開啟設定</div>
      <div class="menu-item" data-act="export">💾 匯出設定</div>
      <div class="menu-item" data-act="save">✅ 儲存設定</div>
    </div>
  </div>
  <span class="brand">📊 台股追蹤</span>
  <div class="spacer"></div>
  <button class="btn" id="sync-btn" title="更新資料">🔄 更新</button>
  <button class="btn icon" id="theme-btn" title="切換主題">🌙</button>
</nav>

<!-- ══ MOBILE TAB BAR (portrait 手機/平板才顯示：清單/圖表 分頁切換) ══ -->
<div id="mobile-tabbar">
  <button class="mtab-btn active" id="mtab-list" data-tab="list">📋 清單</button>
  <button class="mtab-btn" id="mtab-chart" data-tab="chart">📈 圖表</button>
</div>

<!-- ══ MAIN ══ -->
<div id="main" class="show-list">

  <!-- drawer overlay (landscape 手機/平板才顯示：點擊關閉側邊抽屜) -->
  <div id="drawer-overlay"></div>

  <!-- sidebar -->
  <aside id="sidebar">
    <div id="sidebar-top">
      <select id="view-sel">
        <option value="sector">類股</option>
        <option value="strong">強勢股</option>
        <option value="watchlist">自選股</option>
      </select>
      <select id="sector-sel" class="hidden"></select>
      <div id="strong-bar" class="hidden">
        <select id="strong-method-sel">
          <option value="current">目前原則(型態訊號)</option>
          <option value="xq">XQ原則(RS值動能)</option>
        </select>
        <button class="btn primary" id="strong-filter-btn">🔍 過濾強勢股</button>
        <div id="strong-status"></div>
      </div>
      <div id="wl-bar" class="hidden">
        <input id="wl-input" type="text" placeholder="輸入股票代號，按 Enter 新增">
        <button class="btn primary" id="wl-add">+</button>
      </div>
    </div>
    <div id="stock-list-wrap">
      <table id="stock-table">
        <thead>
          <tr>
            <th>代號</th>
            <th>名稱</th>
            <th>開</th>
            <th>高</th>
            <th>低</th>
            <th>收</th>
            <th>趨勢</th>
          </tr>
        </thead>
        <tbody id="stock-tbody"></tbody>
      </table>
    </div>
    <div id="paginator">
      <button class="btn icon" id="prev-btn">◀</button>
      <span id="page-info">— / —</span>
      <button class="btn icon" id="next-btn">▶</button>
    </div>
  </aside>

  <!-- resize handle -->
  <div id="resize-handle"></div>

  <!-- chart -->
  <div id="chart-area">
    <div id="chart-header">
      <button class="btn icon" id="drawer-toggle-btn" title="開啟股票清單">📋</button>
      <span id="chart-title">請從左側選擇股票</span>
      <span id="chart-info"></span>
      <span id="chart-fetch-hint" class="hidden"></span>
      <div class="chart-toolbar">
        <div class="seg-group" id="subpanel-toggle">
          <button class="seg-btn active" data-panel="volume">成交量</button>
          <button class="seg-btn" data-panel="macd">MACD</button>
          <button class="seg-btn" data-panel="kd">KD</button>
          <button class="seg-btn" data-panel="rsv">RSV</button>
        </div>
        <button class="btn icon" id="zoom-in-btn" title="放大（範圍拉近）">🔍+</button>
        <button class="btn icon" id="zoom-out-btn" title="縮小（範圍拉遠）">🔍-</button>
        <button class="btn icon" id="zoom-reset-btn" title="還原全部範圍">⤢</button>
        <button class="btn icon" id="chart-settings-btn" title="圖表設定">⚙</button>
      </div>
    </div>
    <div id="chart-wrap">
      <canvas id="main-chart"></canvas>
    </div>
  </div>
</div>

<!-- ══ SETTINGS MODAL ══ -->
<div id="settings-modal" class="modal-overlay hidden">
  <div class="modal-box">
    <div class="modal-header">
      <span>⚙ 圖表設定</span>
      <button class="btn icon" id="settings-close">✕</button>
    </div>
    <div class="modal-body">
      <div class="modal-sidebar">
        <div class="modal-cat active" data-cat="ma">均線週期</div>
        <div class="modal-cat" data-cat="strong">強勢股門檻</div>
      </div>
      <div class="modal-content">
        <div class="modal-pane" data-pane="ma">
          <h3>均線週期（短均 / 中均 / 長均）</h3>
          <label>短期 MA <input type="number" id="ma-short" min="1" max="250"></label>
          <label>中期 MA <input type="number" id="ma-mid" min="1" max="250"></label>
          <label>長期 MA <input type="number" id="ma-long" min="1" max="250"></label>
        </div>
        <div class="modal-pane hidden" data-pane="strong">
          <h3>目前原則（型態訊號評分）</h3>
          <label>最低綜合分數 <input type="number" id="strong-min-score" min="0" max="5"></label>
          <h3>XQ原則（RS值動能）</h3>
          <label>RS值門檻 <input type="number" id="strong-rs-th" min="1" max="99"></label>
          <label>量比門檻 <input type="number" id="strong-vol-ratio" min="0" step="0.1"></label>

/* ════════════════════════════════════════

   ════════════════════════════════════════ */
const RAW = 'https://raw.githubusercontent.com/sunneo/tw_stock_db';
/* 網頁優化用的小型快照：db/core.db（股票清單，很小）+ db/monthly/<yyyy>/<mm>.db
   （逐月資料，過去月份封存後不再變動），取代整份 300MB+ tw_stock.db 的下載方式。
   見 tw-stock-db/sync/monthly_snapshot.py。 */
const WEB_MANIFEST_URL = RAW + '/db-snapshot/db/monthly/manifest.json';

/* ── 月份字串工具（'YYYY-MM'），供 lazy-load 月份資料使用 ── */
function monthLabel(d) { return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`; }
function shiftMonthLabel(label, delta) {
  const [y, m] = label.split('-').map(Number);
  return monthLabel(new Date(y, m - 1 + delta, 1));
}

/* ── Client-side schema (mirrors db/schema.sql for the tables the web app needs) ── */
const CREATE_SCHEMA_SQL = `
CREATE TABLE IF NOT EXISTS sectors (
    sector_id   INTEGER PRIMARY KEY,
    sector_name TEXT NOT NULL UNIQUE

CREATE TABLE IF NOT EXISTS stocks (

`;

const SECTOR_NAMES = {
  1:'水泥工業', 2:'食品工業', 3:'塑膠工業', 4:'紡織纖維',
  5:'電機機械', 6:'電器電纜', 7:'化學工業', 8:'玻璃陶瓷',
  9:'鋼鐵工業', 10:'橡膠工業', 11:'汽車工業', 12:'半導體業',
  13:'電腦及週邊設備業', 14:'光電業', 15:'通信網路業',
  16:'電子零組件業', 17:'電子通路業', 18:'資訊服務業',
  19:'其他電子業', 20:'建材營造業', 21:'航運業',
  22:'觀光餐旅業', 23:'金融保險業', 24:'貿易百貨業',
  25:'油電燃氣業', 26:'其他業',
};

const PAGE_SIZE = 20;

/* ════════════════════════════════════════
   CANVAS HELPER — rounded rect (always resets path)
   ════════════════════════════════════════ */
function rrect(ctx, x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

/* ════════════════════════════════════════
   SETTINGS  (localStorage)
   ════════════════════════════════════════ */
const Settings = (() => {
  const KEY = 'tw_stock_cfg';
  let d = {};

  function defaults() {
    return { theme:'light', view:'sector', sectorId:null,
             selectedStock:null, watchlist:[], lastDailyDate:null,
             maPeriods: { short:5, mid:20, long:60 },
             chartSubPanel: 'volume',
             strongMethod: 'current',
             strongParams: { minScore:2, rsThreshold:90, minVolRatio:0.8, nearHighPct:15 } };
  }
  function load() {
    try { d = Object.assign(defaults(), JSON.parse(localStorage.getItem(KEY) || '{}')); }
    catch { d = defaults(); }
  }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(d)); } catch {} }
  function get(k) { return d[k]; }
  function set(k, v) { d[k] = v; save(); }
  function reset() { d = defaults(); save(); }
  function exportSettings() {
    const blob = new Blob([JSON.stringify(d, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'tw_stock_settings.json';
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  }
  async function importFile(file) {
    const txt = await file.text();
    const src = JSON.parse(txt);
    if (Array.isArray(src.watchlist)) d.watchlist = src.watchlist;
    if (src.theme) d.theme = src.theme;
    save();
  }

  load();
  return { get, set, reset, save, exportSettings, importFile };
})();

/* ════════════════════════════════════════
   IDB STORAGE
   ════════════════════════════════════════ */
const IDB = (() => {
  let _db = null;
  const DB_NAME = 'tw_stock_idb';
  const DB_VER  = 1;

  async function open() {
    if (_db) return _db;
    return new Promise((resolve, reject) => {
      const req = indexedDB.open(DB_NAME, DB_VER);
      req.onupgradeneeded = e => {
        const db = e.target.result;
        if (!db.objectStoreNames.contains('blobs')) db.createObjectStore('blobs', { keyPath:'k' });
        if (!db.objectStoreNames.contains('meta'))  db.createObjectStore('meta',  { keyPath:'k' });
      };
      req.onsuccess = e => { _db = e.target.result; resolve(_db); };
      req.onerror   = e => reject(e.target.error);
    });
  }

  async function set(store, k, v) {
    const db = await open();
    return new Promise((res, rej) => {
      const tx = db.transaction(store, 'readwrite');
      tx.objectStore(store).put({ k, v });
      tx.oncomplete = res;
      tx.onerror = e => rej(e.target.error);
    });
  }

  async function get(store, k) {
    const db = await open();
    return new Promise((res, rej) => {
      const tx  = db.transaction(store, 'readonly');
      const req = tx.objectStore(store).get(k);
      req.onsuccess = e => res(e.target.result?.v);
      req.onerror   = e => rej(e.target.error);
    });
  }

  return { set, get };
})();

/* ════════════════════════════════════════
   DB MANAGER
   ════════════════════════════════════════ */
const DBMgr = (() => {
  let SQL = null;
  let db  = null;
  let webManifest  = null;         // db/monthly/manifest.json (core + months list)
  let loadedMonths = new Set();    // 'YYYY-MM' labels already merged into `db`

  /* ── helpers ── */
  function query(sql, params = []) {
    if (!db) return [];
    try {
      const res = db.exec(sql, params);
      if (!res.length) return [];
      const { columns, values } = res[0];
      return values.map(row => Object.fromEntries(columns.map((c, i) => [c, row[i]])));
    } catch (e) { console.warn('SQL error:', e.message, '\n', sql); return []; }
  }

  function run(sql, params = []) {
    if (!db) return;
    try { db.run(sql, params); } catch (e) { console.warn('SQL run error:', e.message); }
  }

  /* ── SHA-256 via SubtleCrypto ── */
  async function sha256hex(buf) {
    const hash = await crypto.subtle.digest('SHA-256', buf);
    return Array.from(new Uint8Array(hash)).map(b => b.toString(16).padStart(2, '0')).join('');
  }

  /* ── Persist current db + which months are merged back to IDB ── */
  async function persist() {
    if (!db) return;
    const data = db.export();
    await IDB.set('blobs', 'sqlite_v2', data.buffer);
    await IDB.set('meta', 'dbmeta_v2', {
      coreSha256: webManifest?.core?.sha256 || null,
      loadedMonths: [...loadedMonths],
      storedAt: new Date().toISOString(),
    });
  }

  /* ── Client-side schema migration safety net: a cached db from an older version
     of this web app may predate a newly-added column. Without this, any query
     referencing a missing column throws and silently returns []. ── */
  function ensureSchemaMigrations() {
    if (!db) return;
    const MIGRATIONS = [
      ['technical_indicators', 'rs_rating', 'REAL'],
    ];
    for (const [table, column, type] of MIGRATIONS) {
      try {
        const cols = query(`PRAGMA table_info(${table})`).map(c => c.name);
        if (cols.length && !cols.includes(column)) {
          run(`ALTER TABLE ${table} ADD COLUMN ${column} ${type}`);
        }
      } catch (e) { console.warn('schema migration failed:', table, column, e.message); }
    }
  }

  /* ── Fetch one file with per-file retry (never forces the caller to re-fetch
     files that already succeeded — see ensureMonthsLoaded) ── */
  async function fetchBytesWithRetry(url, expectedSha256, maxRetries = 3) {
    let lastErr;
    for (let attempt = 1; attempt <= maxRetries; attempt++) {
      try {
        const resp = await fetch(url);
        if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
        const buf = await resp.arrayBuffer();
        if (expectedSha256) {
          const hex = await sha256hex(buf);
          if (hex !== expectedSha256) throw new Error('sha256 驗證不符');
        }
        return buf;
      } catch (e) {
        lastErr = e;
        if (attempt < maxRetries) await new Promise(r => setTimeout(r, 400 * attempt));
      }
    }
    throw new Error(`下載失敗（已重試 ${maxRetries} 次）：${url}（${lastErr?.message || lastErr}）`);
  }

  /* ── Merge an independent sqlite file's rows into the live `db` ── */
  function mergeTables(buf, tableNames) {
    const tmp = new SQL.Database(new Uint8Array(buf));
    try {
      for (const table of tableNames) {
        const res = tmp.exec(`SELECT * FROM ${table}`);
        if (!res.length) continue;
        const { columns, values } = res[0];
        const placeholders = columns.map(() => '?').join(',');
        const stmt = db.prepare(`INSERT OR REPLACE INTO ${table} (${columns.join(',')}) VALUES (${placeholders})`);
        for (const row of values) stmt.run(row);
        stmt.free();
      }
    } finally {
      tmp.close();
    }
  }
  const mergeCoreBytes    = buf => mergeTables(buf, ['sectors', 'stocks']);
  const mergeMonthlyBytes = buf => mergeTables(buf, ['daily_prices', 'technical_indicators', 'market_index']);

  /* ── Web manifest (db/monthly/manifest.json): core.db + list of monthly files ── */
  async function fetchWebManifest() {
    const res = await fetch(WEB_MANIFEST_URL);
    if (!res.ok) throw new Error('無法取得 manifest: ' + res.status);
    webManifest = await res.json();
    return webManifest;
  }

  async function ensureCoreLoaded(onProgress) {
    if (!webManifest) await fetchWebManifest();
    onProgress?.('下載股票清單…', 8);
    const buf = await fetchBytesWithRetry(`${RAW}/db-snapshot/${webManifest.core.path}`, webManifest.core.sha256);
    mergeCoreBytes(buf);
  }

  /* ── Load specific months (skips ones already loaded); a failed month is only
     retried on its own next time — already-merged months are never re-fetched ── */
  async function ensureMonthsLoaded(labels, onProgress) {
    if (!webManifest) await fetchWebManifest();
    const errors = [];
    for (const label of labels) {
      if (loadedMonths.has(label)) continue;
      const entry = (webManifest.months || []).find(m => m.label === label);
      if (!entry) continue; // not published yet (e.g. brand-new current month)
      try {
        onProgress?.(`下載 ${label} 月資料…`);
        const buf = await fetchBytesWithRetry(`${RAW}/db-snapshot/${entry.path}`, entry.sha256);
        mergeMonthlyBytes(buf);
        loadedMonths.add(label);
        await persist();
      } catch (e) {
        console.warn(`月份 ${label} 下載/合併失敗：`, e.message);
        errors.push({ label, message: e.message });
      }
    }
    if (errors.length) {
      const err = new Error(`部分月份資料下載失敗：${errors.map(e => e.label).join(', ')}`);
      err.partialErrors = errors;
      throw err;
    }
  }

  function getLoadedMonths()  { return [...loadedMonths].sort(); }
  function getAvailableMonths() { return (webManifest?.months || []).map(m => m.label).sort(); }
  function oldestLoadedMonth() { const m = getLoadedMonths(); return m.length ? m[0] : null; }
  function hasOlderMonthAvailable() {
    const oldest = oldestLoadedMonth();
    const avail  = getAvailableMonths();
    return !!oldest && avail.length > 0 && avail[0] < oldest;
  }
  function oneOlderMonthLabel() {
    const oldest = oldestLoadedMonth();
    return oldest ? shiftMonthLabel(oldest, -1) : null;
  }

  /* ── Init: try to load the already-merged db from IDB ── */
  async function init(onProgress) {
    onProgress('載入 sql.js…', 3);
    SQL = await initSqlJs({
      locateFile: f => `https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.2/${f}`
    });

    const bytes = await IDB.get('blobs', 'sqlite_v2');
    const meta  = await IDB.get('meta',  'dbmeta_v2');

    if (bytes && meta) {
      onProgress('從本地存儲載入資料庫…', 60);
      db = new SQL.Database(new Uint8Array(bytes));
      loadedMonths = new Set(meta.loadedMonths || []);
      ensureSchemaMigrations();
      onProgress('就緒', 100);
      return { needBootstrap: false };
    }
    return { needBootstrap: true };
  }

  /* ── Fresh install: empty schema + core.db + most recent few months
     (enough calendar days of lookback for MA60/60-day-high to compute cleanly
     across the default 30-day view — see Chart's default zoom). ── */
  async function bootstrapFresh(onProgress) {
    db = new SQL.Database();
    db.run(CREATE_SCHEMA_SQL);

    onProgress('下載 manifest…', 5);
    await fetchWebManifest();

    await ensureCoreLoaded(onProgress);

    const today = monthLabel(new Date());
    const initialMonths = [
      shiftMonthLabel(today, -2), shiftMonthLabel(today, -1), today,
    ];
    onProgress('下載最近月份資料…', 20);
    try {
      await ensureMonthsLoaded(initialMonths, onProgress);
    } catch (e) {
      console.warn('部分月份初始下載失敗，稍後可由每日增量資料或縮放時補齊：', e.message);
    }
    await persist();
  }

  /* ── Ensure at least `count` most-recent published months are loaded
     (used before 強勢股 XQ filtering, which needs ~100 天 lookback for 60日高點) ── */
  async function ensureRecentMonths(count, onProgress) {
    const today = monthLabel(new Date());
    const labels = [];
    for (let i = count - 1; i >= 0; i--) labels.push(shiftMonthLabel(today, -i));
    await ensureMonthsLoaded(labels, onProgress);
  }

  /* ── CSV helpers ── */
  function parseCSV(text) {
    const lines = text.trim().split('\n');
    if (lines.length < 2) return { headers: [], rows: [] };
    const headers = lines[0].trim().split(',');
    const rows = [];
    for (let i = 1; i < lines.length; i++) {
      const cells = splitCSVLine(lines[i]);
      if (cells.length === headers.length) rows.push(cells);
    }
    return { headers, rows };
  }

  function splitCSVLine(line) {
    const res = []; let field = ''; let q = false;
    for (const c of line) {
      if (c === '"') { q = !q; }
      else if (c === ',' && !q) { res.push(field.trim()); field = ''; }
      else { field += c; }
    }
    res.push(field.trim());
    return res;
  }

  const NUM_COLS = new Set([
    'open','high','low','close','volume','sector_id','is_active',
    'ma5','ma10','ma20','ma60','vol_ma5','kd_k','kd_d',
    'macd_dif','macd_macd','macd_osc','rsi6','rsi12',
    'bb_upper','bb_mid','bb_lower','bias20','rs_rating',
  ]);

  function coerce(col, val) {
    if (val === '' || val === null || val === undefined) return null;
    return NUM_COLS.has(col) ? (parseFloat(val) || null) : val;
  }

  function upsertCSV(tableName, text) {
    if (!db) return;
    const { headers, rows } = parseCSV(text);
    if (!headers.length) return;
    const cols = headers.join(', ');
    const ph   = headers.map(() => '?').join(', ');
    const stmt = `INSERT OR REPLACE INTO ${tableName} (${cols}) VALUES (${ph})`;
    for (const row of rows) {
      try { db.run(stmt, headers.map((h, i) => coerce(h, row[i]))); }
      catch { /* skip bad rows */ }
    }
  }

  /* ── Fetch & apply one daily folder (4 files in parallel) ── */
  async function applyDaily(date, onProgress) {
    const base  = `${RAW}/main/daily/${date}`;
    const files = [
      ['stocks',               'stocks'],
      ['daily_prices',         'daily_prices'],
      ['technical_indicators', 'technical_indicators'],
      ['market_index',         'market_index'],
    ];
    await Promise.all(files.map(async ([name, table]) => {
      onProgress?.(`套用 ${name}.csv (${date})`);
      try {
        const r = await fetch(`${base}/${name}.csv`);
        if (r.ok) upsertCSV(table, await r.text());
      } catch { /* skip */ }
    }));
  }

  /* ── Sync missing daily dates (dates processed with limited concurrency) ── */
  async function syncDaily(onProgress, forced = false) {
    const lastStored = Settings.get('lastDailyDate');
    const today = new Date();
    const todayStr = fmtDate(today);

    if (!forced && lastStored === todayStr) return; // already up-to-date

    // Build list of trading day candidates since last stored date.
    // Always re-verify at least the last few days too (re-applying a day is a
    // harmless INSERT OR REPLACE): a day can be marked "synced" even when a
    // write into it silently failed (e.g. a column missing until a schema
    // migration runs), which would otherwise permanently skip that date.
    const REVERIFY_DAYS = 4;
    const incrementalFrom = lastStored
      ? new Date(new Date(lastStored).getTime() + 86400000)
      : new Date(today.getTime() - 14 * 86400000);
    const reverifyFrom = new Date(today.getTime() - REVERIFY_DAYS * 86400000);
    const from = new Date(Math.min(incrementalFrom.getTime(), reverifyFrom.getTime()));

    const dates = [];
    for (let d = new Date(from); d <= today; d.setDate(d.getDate() + 1)) {
      const dow = d.getDay();
      if (dow !== 0 && dow !== 6) dates.push(fmtDate(d));
    }
    if (!dates.length) return;

    const DATE_CONCURRENCY = 4;
    let nextIdx = 0, doneCount = 0;

    async function worker() {
      while (true) {
        const i = nextIdx++;
        if (i >= dates.length) return;
        const date = dates[i];
        onProgress?.(`更新日資料: ${date} (${doneCount + 1}/${dates.length})`, 97);
        await applyDaily(date, onProgress);
        doneCount += 1;
      }
    }

    await Promise.all(
      Array.from({ length: Math.min(DATE_CONCURRENCY, dates.length) }, () => worker())
    );

    Settings.set('lastDailyDate', dates[dates.length - 1]);
    await persist();
  }

  function fmtDate(d) {
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  }

  /* ── Public query helpers ── */
  function getLatestDate() {
    return query('SELECT MAX(trade_date) AS d FROM daily_prices')[0]?.d || null;
  }

  function getSectors() {
    return query('SELECT DISTINCT CAST(sector_id AS INTEGER) AS sid FROM stocks WHERE is_active=1 ORDER BY sid');
  }

  function getStocksBySector(sectorId) {
    return query('SELECT stock_code, stock_name FROM stocks WHERE CAST(sector_id AS INTEGER)=? AND is_active=1 ORDER BY stock_code', [sectorId]);
  }

  /* ── 強勢股 snapshot: daily_prices + technical_indicators for last N days, all active stocks ── */
  function getSnapshot(lookbackDays) {
    return query(`
      SELECT dp.stock_code, s.stock_name, dp.trade_date,
             dp.open, dp.high, dp.low, dp.close, dp.volume,
             ti.ma5, ti.ma20, ti.ma60, ti.vol_ma5,
             ti.kd_k, ti.kd_d, ti.macd_dif, ti.macd_macd, ti.macd_osc,
             ti.bias20, ti.rs_rating
      FROM daily_prices dp
      JOIN stocks s ON s.stock_code = dp.stock_code
      LEFT JOIN technical_indicators ti
        ON ti.stock_code = dp.stock_code AND ti.trade_date = dp.trade_date
      WHERE dp.trade_date >= (SELECT date(MAX(trade_date), ?) FROM daily_prices)
        AND s.is_active = 1
      ORDER BY dp.stock_code, dp.trade_date
    `, [`-${lookbackDays} day`]);
  }

  function groupRowsByCode(rows) {
    const map = new Map();
    for (const r of rows) {
      let arr = map.get(r.stock_code);
      if (!arr) { arr = []; map.set(r.stock_code, arr); }
      arr.push(r);
    }
    return map;
  }

  /* ── 「目前原則」型態訊號評分，對應 analysis/signals.py::_score_group() ── */
  function scoreCurrent(g) {
    const n = g.length;
    if (n < 3) return null;
    const t = g[n - 1], y = g[n - 2], z = g[n - 3];
    if (t.kd_k == null || t.macd_osc == null || t.ma5 == null || t.vol_ma5 == null) return null;

    const bull = [], bear = [];
    if (t.kd_k > t.kd_d && y.kd_k <= y.kd_d && t.kd_d < 80) bull.push('KD黃金交叉');
    if (t.kd_k < t.kd_d && y.kd_k >= y.kd_d && t.kd_d > 20) bear.push('KD死亡交叉');

    if (t.macd_dif > t.macd_macd && t.macd_dif > 0) bull.push('MACD多頭');
    if (t.macd_dif < t.macd_macd && t.macd_dif < 0) bear.push('MACD空頭');

    if (t.macd_osc > 0 && t.macd_osc > y.macd_osc && y.macd_osc <= z.macd_osc) bull.push('紅柱由縮轉長');
    if (t.macd_osc < 0 && t.macd_osc < y.macd_osc && y.macd_osc >= z.macd_osc) bear.push('綠柱由縮轉長');

    if (t.vol_ma5 > 0 && t.volume > t.vol_ma5 * 1.2 && t.close > t.open) bull.push('放量紅K');
    if (t.vol_ma5 > 0 && t.volume > t.vol_ma5 * 1.2 && t.close < t.open) bear.push('放量黑K');

    const recent = g.slice(Math.max(0, n - 6), n - 1);
    if (recent.length >= 3) {
      const recentLow  = Math.min(...recent.map(r => r.low));
      const recentHigh = Math.max(...recent.map(r => r.high));
      if (t.close > t.open && t.close >= t.ma5 && y.close < y.ma5 && t.low >= recentLow) bull.push('回後買上漲');
      if (t.close < t.open && t.close <= t.ma5 && y.close > y.ma5 && t.high <= recentHigh) bear.push('彈後空下跌');
    }

    let chg5 = null;
    if (n >= 6) {
      const base = g[n - 6].close;
      if (base) chg5 = (t.close / base - 1) * 100;
    }
    const volRatio = t.vol_ma5 ? t.volume / t.vol_ma5 : null;

    return {
      stock_code: t.stock_code, stock_name: t.stock_name, trade_date: t.trade_date,
      open: t.open, high: t.high, low: t.low, close: t.close,
      kd_k: t.kd_k, kd_d: t.kd_d, bias20: t.bias20, rs_rating: t.rs_rating,
      chg5, vol_ratio: volRatio,
      bull_signals: bull, bear_signals: bear,
      bull_score: bull.length, bear_score: bear.length,
    };
  }

  function computeStrongCurrent(topN, minScore) {
    const rows   = getSnapshot(20);
    const groups = groupRowsByCode(rows);
    const scored = [];
    for (const g of groups.values()) {
      const s = scoreCurrent(g);
      if (s && s.bull_score >= minScore) scored.push(s);
    }
    scored.sort((a, b) => (b.bull_score - a.bull_score) || ((b.vol_ratio || 0) - (a.vol_ratio || 0)));
    return scored.slice(0, topN);
  }

  /* ── 「XQ原則」RS值動能篩選，對應 analysis/signals.py::xq_strong_stock_filter() ── */
  function computeStrongXQ(topN, rsThreshold, minVolRatio, nearHighPct) {
    const rows       = getSnapshot(100);
    const latestDate = getLatestDate();
    const groups     = groupRowsByCode(rows);
    const results    = [];

    for (const g of groups.values()) {
      const t = g[g.length - 1];
      if (!t || t.trade_date !== latestDate) continue;
      if (t.rs_rating == null || t.ma20 == null || t.ma60 == null || t.vol_ma5 == null) continue;

      const tail   = g.slice(Math.max(0, g.length - 60));
      const high60 = Math.max(...tail.map(r => r.high));
      const distPct  = high60 ? (high60 - t.close) / high60 * 100 : null;
      const volRatio = t.vol_ma5 ? t.volume / t.vol_ma5 : null;

      if (t.rs_rating >= rsThreshold &&
          t.close >= t.ma60 && t.ma20 >= t.ma60 &&
          volRatio != null && volRatio >= minVolRatio &&
          distPct != null && distPct <= nearHighPct) {
        results.push({ ...t, high60, dist_from_high60_pct: distPct, vol_ratio: volRatio });
      }
    }
    results.sort((a, b) => b.rs_rating - a.rs_rating);
    return results.slice(0, topN);
  }

  function getWatchlistStocks(codes) {
    if (!codes.length) return [];
    const d  = getLatestDate();
    const ph = codes.map(() => '?').join(',');
    return query(`
      SELECT s.stock_code, s.stock_name,
             p.open, p.high, p.low, p.close
      FROM stocks s
      LEFT JOIN daily_prices p ON s.stock_code=p.stock_code AND p.trade_date=?
      WHERE s.stock_code IN (${ph})
    `, [d, ...codes]);
  }

  function getStockInfo(code) {
    return query('SELECT stock_code, stock_name FROM stocks WHERE stock_code=?', [code])[0] || null;
  }

  function getPriceHistory(code, limit = 250) {
    return query(
      'SELECT trade_date, open, high, low, close, volume FROM daily_prices WHERE stock_code=? ORDER BY trade_date DESC LIMIT ?',
      [code, limit]
    ).reverse();
  }

  function getBatchSparklines(codes, days = 20) {
    if (!codes.length) return {};
    const ph      = codes.map(() => '?').join(',');
    /* Limit to last ~60 calendar days to keep the query fast */
    const cutoff  = query('SELECT DATE(MAX(trade_date), \'-60 days\') AS d FROM daily_prices')[0]?.d || '2000-01-01';
    const rows    = query(`
      SELECT stock_code, trade_date, close
      FROM daily_prices
      WHERE stock_code IN (${ph}) AND trade_date >= ?
      ORDER BY stock_code, trade_date DESC
    `, [...codes, cutoff]);

    const map = {};
    for (const r of rows) {
      if (!map[r.stock_code]) map[r.stock_code] = [];
      if (map[r.stock_code].length < days) map[r.stock_code].unshift(r.close);
    }
    return map;
  }

  return {
    init, bootstrapFresh, syncDaily,
    fetchWebManifest, ensureMonthsLoaded, ensureRecentMonths,
    getLoadedMonths, getAvailableMonths, hasOlderMonthAvailable, oneOlderMonthLabel,
    getSectors, getStocksBySector, getWatchlistStocks,
    computeStrongCurrent, computeStrongXQ,
    getStockInfo, getPriceHistory, getBatchSparklines,
    getLatestDate,
    isReady: () => !!db,
  };
})();

/* ════════════════════════════════════════
   INDICATOR MATH  (mirrors analysis/compute_indicators.py)
   ════════════════════════════════════════ */
function computeSMA(values, period) {
  const out = new Array(values.length).fill(null);
  let sum = 0, count = 0;
  for (let i = 0; i < values.length; i++) {
    sum += values[i]; count++;
    if (i >= period) { sum -= values[i - period]; count--; }
    if (count >= period) out[i] = sum / period;
  }
  return out;
}

function computeEMA(values, period) {
  const alpha = 2 / (period + 1);
  const out = new Array(values.length).fill(null);
  let prev = null;
  for (let i = 0; i < values.length; i++) {
    if (values[i] == null) { out[i] = prev; continue; }
    prev = prev == null ? values[i] : alpha * values[i] + (1 - alpha) * prev;
    out[i] = prev;
  }
  return out;
}

function computeEMAalpha(values, alpha) {
  const out = new Array(values.length).fill(null);
  let prev = null;
  for (let i = 0; i < values.length; i++) {
    prev = prev == null ? values[i] : alpha * values[i] + (1 - alpha) * prev;
    out[i] = prev;
  }
  return out;
}

function computeMACD(closes) {
  const ema12 = computeEMA(closes, 12);
  const ema26 = computeEMA(closes, 26);
  const dif = closes.map((_, i) => (ema12[i] != null && ema26[i] != null) ? ema12[i] - ema26[i] : null);
  const macd = computeEMAalpha(dif, 2 / 10); // span=9 -> alpha = 2/(9+1)
  const osc = dif.map((v, i) => (v != null && macd[i] != null) ? v - macd[i] : null);
  return { dif, macd, osc };
}

function computeKD(highs, lows, closes, period = 9) {
  const n = closes.length;
  const rsv = new Array(n).fill(50);
  for (let i = 0; i < n; i++) {
    if (i < period - 1) { rsv[i] = 50; continue; }
    const hi = Math.max(...highs.slice(i - period + 1, i + 1));
    const lo = Math.min(...lows.slice(i - period + 1, i + 1));
    rsv[i] = (hi === lo) ? 50 : (closes[i] - lo) / (hi - lo) * 100;
  }
  const k = computeEMAalpha(rsv, 1 / 3);
  const d = computeEMAalpha(k, 1 / 3);
  return { rsv, k, d };
}

/* ════════════════════════════════════════
   CHART MANAGER  (Canvas)
   ════════════════════════════════════════ */
const Chart = (() => {
  const canvas = document.getElementById('main-chart');
  const ctx    = canvas.getContext('2d');
  let fullData = [];   // full price history for current stock
  let ind      = { maS: [], maM: [], maL: [], macdDif: [], macdMacd: [], macdOsc: [], kdK: [], kdD: [], rsv: [] };
  let maPeriods = { short: 5, mid: 20, long: 60 };
  let subPanel  = 'volume';   // 'volume' | 'macd' | 'kd' | 'rsv'
  let visibleCount = null;    // zoom level (candle count); null = compute 30-day default on first load
  let cross    = null;  // {x, y} mouse position
  let locked   = false;
  let onZoomChangeCb = null;  // app-level hook: fires after zoom changes, so more history can be fetched on demand

  /* default zoom = most recent ~30 calendar days (not a fixed candle count,
     since trading-day density varies with holidays) */
  function defaultVisibleCount(rows) {
    if (!rows.length) return 0;
    const cutoff = new Date(rows.at(-1).trade_date).getTime() - 30 * 86400000;
    let count = 0;
    for (let i = rows.length - 1; i >= 0; i--) {
      if (new Date(rows[i].trade_date).getTime() < cutoff) break;
      count++;
    }
    return Math.max(10, count);
  }

  function isDark() { return document.documentElement.getAttribute('data-theme') === 'dark'; }

  function tok(name) {
    return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  }

  function resize() {
    const wrap = document.getElementById('chart-wrap');
    canvas.width  = wrap.clientWidth;
    canvas.height = wrap.clientHeight;
    draw();
  }

  function recompute() {
    const closes = fullData.map(d => d.close);
    const highs  = fullData.map(d => d.high);
    const lows   = fullData.map(d => d.low);
    ind.maS = computeSMA(closes, maPeriods.short);
    ind.maM = computeSMA(closes, maPeriods.mid);
    ind.maL = computeSMA(closes, maPeriods.long);
    const m = computeMACD(closes);
    ind.macdDif = m.dif; ind.macdMacd = m.macd; ind.macdOsc = m.osc;
    const kd = computeKD(highs, lows, closes, 9);
    ind.kdK = kd.k; ind.kdD = kd.d; ind.rsv = kd.rsv;
  }

  function setData(rows) {
    fullData = rows;
    recompute();
    if (visibleCount == null) visibleCount = defaultVisibleCount(fullData);
    visibleCount = Math.min(visibleCount, fullData.length) || fullData.length;
    cross  = null;
    locked = false;
    draw();
  }

  function setMAPeriods(p) {
    maPeriods = { ...p };
    if (fullData.length) recompute();
    draw();
  }

  function setSubPanel(p) { subPanel = p; draw(); }
  function setOnZoomChange(fn) { onZoomChangeCb = fn; }
  function getVisibleCount()   { return visibleCount || 0; }
  function getFullDataLength() { return fullData.length; }

  function zoomIn() {
    if (!fullData.length) return;
    visibleCount = Math.max(20, Math.round(visibleCount * 0.7));
    draw();
    onZoomChangeCb?.();
  }
  function zoomOut() {
    if (!fullData.length) return;
    visibleCount = Math.round(visibleCount / 0.7) || fullData.length;
    draw();
    onZoomChangeCb?.();
  }
  function zoomReset() {
    if (!fullData.length) return;
    visibleCount = fullData.length;
    draw();
    onZoomChangeCb?.();
  }

  function fmtVol(v) {
    if (!v && v !== 0) return '-';
    if (v >= 1e8) return (v / 1e8).toFixed(1) + '億';
    if (v >= 1e6) return (v / 1e6).toFixed(1) + 'M';
    if (v >= 1e4) return (v / 1e4).toFixed(0) + '萬';
    return v.toLocaleString();
  }

  const MA_S_COL = '#f59e0b'; // amber
  const MA_M_COL = '#3b82f6'; // blue
  const MA_L_COL = '#a855f7'; // purple

  function drawLine(points, getY, xOf, color) {
    ctx.strokeStyle = color;
    ctx.lineWidth   = 1.4;
    ctx.beginPath();
    let started = false;
    for (let i = 0; i < points.length; i++) {
      const v = points[i];
      if (v == null) { started = false; continue; }
      const x = xOf(i), y = getY(v);
      if (!started) { ctx.moveTo(x, y); started = true; }
      else ctx.lineTo(x, y);
    }
    ctx.stroke();
  }

  function draw() {
    const W = canvas.width, H = canvas.height;
    if (!W || !H) return;

    const dark    = isDark();
    const bgCol   = tok('--bg1');
    const txtCol  = tok('--txt0');
    const txt2Col = tok('--txt2');
    const gridCol = dark ? '#1e2530' : '#f3f4f6';
    const bdrCol  = tok('--bdr');
    const upCol   = tok('--up');
    const dnCol   = tok('--dn');
    const accCol  = tok('--acc');

    ctx.fillStyle = bgCol;
    ctx.fillRect(0, 0, W, H);

    if (!fullData.length) {
      ctx.fillStyle = txt2Col;
      ctx.font      = '14px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('請從左側點選股票', W / 2, H / 2);
      return;
    }

    /* visible window slice (zoom): compute indicators over full history, render only the tail */
    const NFull    = fullData.length;
    const vcount   = Math.min(visibleCount || NFull, NFull);
    const startIdx = NFull - vcount;
    const data     = fullData.slice(startIdx);
    const maS      = ind.maS.slice(startIdx);
    const maM      = ind.maM.slice(startIdx);
    const maL      = ind.maL.slice(startIdx);
    const mDif     = ind.macdDif.slice(startIdx);
    const mMacd    = ind.macdMacd.slice(startIdx);
    const mOsc     = ind.macdOsc.slice(startIdx);
    const kdK      = ind.kdK.slice(startIdx);
    const kdD      = ind.kdD.slice(startIdx);
    const rsv      = ind.rsv.slice(startIdx);

    const hasIndicatorPane = subPanel !== 'volume';

    /* layout */
    const PAD_L   = 8;
    const PAD_R   = 62;
    const PAD_TOP = 16;
    const PAD_BOT = 22;
    const usableH = H - PAD_TOP - PAD_BOT;

    let priceH, volH, indH;
    if (hasIndicatorPane) {
      priceH = usableH * 0.50;
      volH   = usableH * 0.16;
      indH   = usableH * 0.34 - 12;
    } else {
      priceH = usableH * 0.72;
      volH   = usableH * 0.28 - 4;
      indH   = 0;
    }
    const priceTop = PAD_TOP, priceBot = priceTop + priceH;
    const volTop   = priceBot + 6, volBot = volTop + volH;
    const indTop   = volBot + 6, indBot  = indTop + Math.max(0, indH);

    const drawW   = W - PAD_L - PAD_R;
    const N       = data.length;
    const step    = drawW / N;
    const candleW = Math.max(1, Math.floor(step * 0.7));
    const xOf     = i => PAD_L + (i + 0.5) * step;

    /* price range (include visible MA lines so they never clip) */
    let minP = Infinity, maxP = -Infinity;
    for (const d of data) {
      if (d.high > maxP) maxP = d.high;
      if (d.low  < minP) minP = d.low;
    }
    for (const arr of [maS, maM, maL]) {
      for (const v of arr) { if (v == null) continue; if (v > maxP) maxP = v; if (v < minP) minP = v; }
    }
    const pPad = (maxP - minP) * 0.06 || 1;
    minP -= pPad; maxP += pPad;

    /* volume range */
    let maxV = 0;
    for (const d of data) if ((d.volume || 0) > maxV) maxV = d.volume;

    const pY = p => priceTop + ((maxP - p) / (maxP - minP)) * priceH;
    const vY = v => volTop + (1 - (v / maxV)) * volH;

    /* price grid */
    ctx.strokeStyle = gridCol;
    ctx.lineWidth   = 1;
    const ticks = 5;
    for (let i = 0; i <= ticks; i++) {
      const p = minP + (maxP - minP) * i / ticks;
      const y = pY(p);
      ctx.beginPath(); ctx.moveTo(PAD_L, y); ctx.lineTo(W - PAD_R, y); ctx.stroke();
      ctx.fillStyle  = txt2Col;
      ctx.font       = '10px monospace';
      ctx.textAlign  = 'right';
      ctx.fillText(p.toFixed(2), W - 2, y + 3);
    }

    /* separators */
    ctx.strokeStyle = bdrCol; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(PAD_L, priceBot + 3); ctx.lineTo(W, priceBot + 3); ctx.stroke();
    if (hasIndicatorPane) {
      ctx.beginPath(); ctx.moveTo(PAD_L, volBot + 3); ctx.lineTo(W, volBot + 3); ctx.stroke();
    }

    /* vol label */
    ctx.fillStyle = txt2Col; ctx.font = '10px monospace'; ctx.textAlign = 'right';
    ctx.fillText(fmtVol(maxV), W - 2, volTop + 11);

    /* candles & volume */
    for (let i = 0; i < N; i++) {
      const d  = data[i];
      const cx = xOf(i);
      const up = d.close >= d.open;
      const col = up ? upCol : dnCol;

      /* wick */
      ctx.strokeStyle = col; ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(cx, pY(d.high));
      ctx.lineTo(cx, pY(d.low));
      ctx.stroke();

      /* body */
      const y1 = pY(Math.max(d.open, d.close));
      const y2 = pY(Math.min(d.open, d.close));
      const bh = Math.max(1, y2 - y1);
      ctx.fillStyle = up ? upCol : 'transparent';
      ctx.strokeStyle = col; ctx.lineWidth = 1;
      ctx.fillRect(cx - candleW / 2, y1, candleW, bh);
      ctx.strokeRect(cx - candleW / 2, y1, candleW, bh);

      /* volume bar */
      const vTop2 = vY(d.volume || 0);
      ctx.fillStyle   = col;
      ctx.globalAlpha = 0.65;
      ctx.fillRect(cx - candleW / 2, vTop2, candleW, volBot - vTop2);
      ctx.globalAlpha = 1;

      /* date axis (sparse) */
      const interval = Math.max(1, Math.floor(N / 8));
      if (i % interval === 0) {
        ctx.fillStyle  = txt2Col;
        ctx.font       = '10px sans-serif';
        ctx.textAlign  = 'center';
        ctx.fillText((d.trade_date || '').slice(5), cx, H - 5);
      }
    }

    /* MA overlay lines on price pane */
    drawLine(maS, pY, xOf, MA_S_COL);
    drawLine(maM, pY, xOf, MA_M_COL);
    drawLine(maL, pY, xOf, MA_L_COL);

    /* MA legend (top-left of price pane) */
    const lastS = maS.at(-1), lastM = maM.at(-1), lastL = maL.at(-1);
    ctx.font = '10px monospace'; ctx.textAlign = 'left';
    let lx = PAD_L + 4;
    const legendY = priceTop + 10;
    const legend = [
      [`MA${maPeriods.short}`, lastS, MA_S_COL],
      [`MA${maPeriods.mid}`,  lastM, MA_M_COL],
      [`MA${maPeriods.long}`, lastL, MA_L_COL],
    ];
    for (const [label, val, color] of legend) {
      const txt = val != null ? `${label} ${val.toFixed(2)}` : `${label} -`;
      ctx.fillStyle = color;
      ctx.fillText(txt, lx, legendY);
      lx += ctx.measureText(txt).width + 12;
    }

    /* sub-indicator pane (MACD / KD / RSV) */
    if (hasIndicatorPane) {
      ctx.font = '10px monospace'; ctx.textAlign = 'left';
      if (subPanel === 'macd') {
        let lo = 0, hi = 0;
        for (const arr of [mDif, mMacd, mOsc]) for (const v of arr) { if (v == null) continue; if (v < lo) lo = v; if (v > hi) hi = v; }
        const pad = (hi - lo) * 0.1 || 1; lo -= pad; hi += pad;
        const iY = v => indTop + (1 - (v - lo) / (hi - lo)) * indH;
        /* zero line */
        ctx.strokeStyle = gridCol; ctx.beginPath(); ctx.moveTo(PAD_L, iY(0)); ctx.lineTo(W - PAD_R, iY(0)); ctx.stroke();
        /* histogram */
        for (let i = 0; i < N; i++) {
          const v = mOsc[i]; if (v == null) continue;
          const cx = xOf(i);
          const y0 = iY(0), y1 = iY(v);
          ctx.fillStyle = v >= 0 ? upCol : dnCol;
          ctx.globalAlpha = 0.65;
          ctx.fillRect(cx - candleW / 2, Math.min(y0, y1), candleW, Math.abs(y1 - y0) || 1);
          ctx.globalAlpha = 1;
        }
        drawLine(mDif, iY, xOf, MA_M_COL);
        drawLine(mMacd, iY, xOf, MA_S_COL);
        ctx.fillStyle = MA_M_COL; ctx.fillText('DIF', PAD_L + 4, indTop + 10);
        ctx.fillStyle = MA_S_COL; ctx.fillText('MACD', PAD_L + 40, indTop + 10);
      } else if (subPanel === 'kd') {
        const iY = v => indTop + (1 - v / 100) * indH;
        ctx.strokeStyle = gridCol; ctx.setLineDash([3, 3]);
        [20, 80].forEach(v => { ctx.beginPath(); ctx.moveTo(PAD_L, iY(v)); ctx.lineTo(W - PAD_R, iY(v)); ctx.stroke(); });
        ctx.setLineDash([]);
        drawLine(kdK, iY, xOf, MA_M_COL);
        drawLine(kdD, iY, xOf, MA_S_COL);
        ctx.fillStyle = MA_M_COL; ctx.fillText('K', PAD_L + 4, indTop + 10);
        ctx.fillStyle = MA_S_COL; ctx.fillText('D', PAD_L + 24, indTop + 10);
      } else if (subPanel === 'rsv') {
        const iY = v => indTop + (1 - v / 100) * indH;
        ctx.strokeStyle = gridCol; ctx.setLineDash([3, 3]);
        [20, 80].forEach(v => { ctx.beginPath(); ctx.moveTo(PAD_L, iY(v)); ctx.lineTo(W - PAD_R, iY(v)); ctx.stroke(); });
        ctx.setLineDash([]);
        drawLine(rsv, iY, xOf, accCol);
        ctx.fillStyle = accCol; ctx.fillText('RSV(9)', PAD_L + 4, indTop + 10);
      }
    }

    /* ── crosshair ── */
    if (cross) {
      const { x, y } = cross;
      ctx.setLineDash([4, 4]);
      ctx.strokeStyle = dark ? 'rgba(255,255,255,.45)' : 'rgba(0,0,0,.35)';
      ctx.lineWidth   = 1;
      ctx.beginPath(); ctx.moveTo(x, 0);   ctx.lineTo(x, H); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, y);   ctx.lineTo(W, y); ctx.stroke();
      ctx.setLineDash([]);

      /* nearest candle index */
      const idx = Math.min(N - 1, Math.max(0, Math.round((x - PAD_L) / step - 0.5)));
      const d   = data[idx];

      /* price tag on Y axis */
      if (y > priceTop && y < priceBot) {
        const price = maxP - (y - priceTop) / priceH * (maxP - minP);
        ctx.fillStyle   = tok('--acc2');
        ctx.strokeStyle = accCol;
        ctx.lineWidth   = 1;
        rrect(ctx, W - PAD_R, y - 9, PAD_R, 18, 3);
        ctx.fill(); ctx.stroke();
        ctx.fillStyle  = accCol;
        ctx.font       = '10px monospace';
        ctx.textAlign  = 'center';
        ctx.fillText(price.toFixed(2), W - PAD_R / 2, y + 4);
      }

      /* tooltip box */
      const lines = [
        d.trade_date || '',
        `開 ${(d.open  || 0).toFixed(2)}`,
        `高 ${(d.high  || 0).toFixed(2)}`,
        `低 ${(d.low   || 0).toFixed(2)}`,
        `收 ${(d.close || 0).toFixed(2)}`,
        `量 ${fmtVol(d.volume)}`,
      ];
      const nInfoLines = lines.length;
      if (maS[idx] != null) lines.push(`MA${maPeriods.short} ${maS[idx].toFixed(2)}`);
      if (maM[idx] != null) lines.push(`MA${maPeriods.mid} ${maM[idx].toFixed(2)}`);
      if (maL[idx] != null) lines.push(`MA${maPeriods.long} ${maL[idx].toFixed(2)}`);
      if (subPanel === 'macd' && mOsc[idx] != null) lines.push(`OSC ${mOsc[idx].toFixed(2)}`);
      if (subPanel === 'kd' && kdK[idx] != null) lines.push(`K ${kdK[idx].toFixed(1)}  D ${kdD[idx].toFixed(1)}`);
      if (subPanel === 'rsv' && rsv[idx] != null) lines.push(`RSV ${rsv[idx].toFixed(1)}`);

      const TW = 128, TH = lines.length * 16 + 10;
      const tx = x + 12 + TW > W ? x - TW - 12 : x + 12;
      const ty = y + TH + 8 > H ? y - TH - 8 : y + 8;

      ctx.fillStyle   = dark ? 'rgba(22,27,34,.93)' : 'rgba(255,255,255,.95)';
      ctx.strokeStyle = bdrCol;
      ctx.lineWidth   = 1;
      rrect(ctx, tx, ty, TW, TH, 6);
      ctx.fill(); ctx.stroke();

      ctx.font      = '11px monospace';
      ctx.textAlign = 'left';
      const upDown  = (d.close >= d.open) ? upCol : dnCol;
      lines.forEach((ln, i) => {
        ctx.fillStyle = (i >= 1 && i <= nInfoLines - 1) ? upDown : txt2Col;
        ctx.fillText(ln, tx + 8, ty + 14 + i * 16);
      });

      /* locked indicator */
      if (locked) {
        ctx.fillStyle  = txt2Col;
        ctx.font       = '10px sans-serif';
        ctx.textAlign  = 'left';
        ctx.fillText('🔒', tx + TW - 18, ty + 13);
      }
    }
  }

  /* events */
  canvas.addEventListener('mousemove', e => {
    if (locked) return;
    const r = canvas.getBoundingClientRect();
    cross   = { x: e.clientX - r.left, y: e.clientY - r.top };
    draw();
  });
  canvas.addEventListener('mouseleave', () => {
    if (!locked) { cross = null; draw(); }
  });
  canvas.addEventListener('click', () => {
    if (!fullData.length) return;
    if (!locked && !cross) return;
    locked = !locked;
    draw();
  });
  canvas.addEventListener('wheel', e => {
    if (!fullData.length) return;
    e.preventDefault();
    if (e.deltaY < 0) zoomIn(); else if (e.deltaY > 0) zoomOut();
  }, { passive: false });

  return {
    setData, resize, setMAPeriods, setSubPanel, zoomIn, zoomOut, zoomReset,
    setOnZoomChange, getVisibleCount, getFullDataLength,
  };
})();

/* ════════════════════════════════════════
   SVG SPARKLINE
   ════════════════════════════════════════ */
function sparkline(closes, w = 60, h = 20) {
  if (!closes || closes.length < 2) return '<svg width="60" height="20"></svg>';
  const min = Math.min(...closes), max = Math.max(...closes);
  const rng = max - min || 1;
  const step = w / (closes.length - 1);
  const pts  = closes.map((c, i) => {
    const x = +(i * step).toFixed(1);
    const y = +(h - 1 - ((c - min) / rng) * (h - 2)).toFixed(1);
    return `${x},${y}`;
  }).join(' ');
  const dark  = document.documentElement.getAttribute('data-theme') === 'dark';
  const isUp  = closes.at(-1) >= closes[0];
  const color = isUp ? (dark ? '#f87171' : '#dc2626') : (dark ? '#4ade80' : '#16a34a');
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" style="overflow:visible">` +
    `<polyline points="${pts}" fill="none" stroke="${color}" stroke-width="1.5" stroke-linejoin="round"/>` +
    `</svg>`;
}

/* ════════════════════════════════════════
   RENDER STOCK LIST
   ════════════════════════════════════════ */
function renderPage() {
  const { stocks, page } = State;
  const total      = stocks.length;
  const totalPages = Math.max(1, Math.ceil(total / PAGE_SIZE));
  const start      = page * PAGE_SIZE;
  const pageItems  = stocks.slice(start, start + PAGE_SIZE);

  R.pageInfo.textContent = `${page + 1} / ${totalPages}`;
  R.prevBtn.disabled = page === 0;
  R.nextBtn.disabled = page >= totalPages - 1;

  if (!pageItems.length) {
    R.stockTbody.innerHTML = '<tr><td colspan="8" class="empty-hint">無資料</td></tr>';
    return;
  }

  const selCode  = Settings.get('selectedStock');
  const view     = R.viewSel.value;
  const isWL     = view === 'watchlist';
  const isStrong = view === 'strong';
  const codes    = pageItems.map(s => s.stock_code);
  const sparkMap = DBMgr.getBatchSparklines(codes, 20);

  const rows = pageItems.map(s => {
    const closes  = sparkMap[s.stock_code] || [];
    const svg     = sparkline(closes);
    const open    = s.open,  close = s.close;
    const high    = s.high,  low   = s.low;
    const cls     = (close == null || open == null) ? 'td-flat'
                  : close > open ? 'td-up'
                  : close < open ? 'td-dn' : 'td-flat';
    const isSel   = s.stock_code === selCode;

    let extraTd = '';
    if (isWL) {
      extraTd = `<td><button class="del-btn" data-code="${s.stock_code}">✕</button></td>`;
    } else if (isStrong) {
      const txt = State.strongMethodUsed === 'xq'
        ? (s.rs_rating != null ? Math.round(s.rs_rating) : '-')
        : (s.bull_score != null ? `${s.bull_score}分` : '-');
      extraTd = `<td>${txt}</td>`;
    }

    return `<tr data-code="${s.stock_code}" class="${isSel ? 'selected' : ''}"
               draggable="${isWL ? 'true' : 'false'}">
      <td class="td-code">${s.stock_code}</td>
      <td class="td-name" title="${s.stock_name || ''}">${s.stock_name || ''}</td>
      <td>${open   != null ? open.toFixed(2)  : '-'}</td>
      <td>${high   != null ? high.toFixed(2)  : '-'}</td>
      <td>${low    != null ? low.toFixed(2)   : '-'}</td>
      <td class="${cls}">${close != null ? close.toFixed(2) : '-'}</td>
      <td class="td-spark">${svg}</td>
      ${extraTd}
    </tr>`;
  });

  R.stockTbody.innerHTML = rows.join('');

  /* row click → select stock */
  R.stockTbody.querySelectorAll('tr[data-code]').forEach(tr => {
    tr.addEventListener('click', e => {
      if (e.target.classList.contains('del-btn')) return;
      selectStock(tr.dataset.code);
    });
  });

  /* delete from watchlist */
  R.stockTbody.querySelectorAll('.del-btn').forEach(btn => {
    btn.addEventListener('click', e => {
      e.stopPropagation();
      removeFromWatchlist(btn.dataset.code);
    });
  });

  /* drag-and-drop reorder (watchlist) */
  if (isWL) setupDragDrop(R.stockTbody);
}

/* ════════════════════════════════════════
   DRAG & DROP (watchlist reorder)
   ════════════════════════════════════════ */
function setupDragDrop(tbody) {
  let dragging = null;

  tbody.querySelectorAll('tr[draggable="true"]').forEach(tr => {
    tr.addEventListener('dragstart', () => {
      dragging = tr.dataset.code;
      tr.style.opacity = '0.4';
    });
    tr.addEventListener('dragend', () => {
      tr.style.opacity = '';
      tbody.querySelectorAll('tr').forEach(r => r.classList.remove('drag-over'));
    });
    tr.addEventListener('dragover', e => {
      e.preventDefault();
      tbody.querySelectorAll('tr').forEach(r => r.classList.remove('drag-over'));
      tr.classList.add('drag-over');
    });
    tr.addEventListener('drop', e => {
      e.preventDefault();
      if (!dragging || dragging === tr.dataset.code) return;
      const wl  = Settings.get('watchlist') || [];
      const fi  = wl.indexOf(dragging);
      const ti  = wl.indexOf(tr.dataset.code);
      if (fi >= 0 && ti >= 0) {
        wl.splice(fi, 1);
        wl.splice(ti, 0, dragging);
        Settings.set('watchlist', wl);
        loadWatchlist();
      }
    });
  });
}

/* ════════════════════════════════════════
   VIEW LOADERS
   ════════════════════════════════════════ */
function loadSector(sectorId) {
  if (!sectorId) { State.stocks = []; State.page = 0; renderPage(); return; }
  State.stocks = DBMgr.getStocksBySector(sectorId);
  State.page   = 0;
  renderPage();
}

/* 強勢股: expensive to compute, so only run when the user presses [過濾強勢股] */
function updateExtraColumn(view) {
  const thead = document.querySelector('#stock-table thead tr');
  const existing = thead.querySelector('.extra-col');
  if (existing) existing.remove();
  if (view === 'watchlist' || view === 'strong') {
    const th = document.createElement('th');
    th.className = 'extra-col';
    th.textContent = view === 'strong'
      ? (State.strongMethodUsed === 'xq' ? 'RS值' : '分數')
      : '';
    thead.appendChild(th);
  }
}

async function runStrongFilter() {
  const method = R.strongMethodSel.value;
  Settings.set('strongMethod', method);
  R.strongFilterBtn.disabled = true;

  /* XQ 原則需要約100天(距60日高點)的歷史，目前原則只需要約20天；
     按需先確保月度資料已載入夠用的範圍，不夠時才去抓（計算需要的範圍再開始抓）。 */
  R.strongStatus.textContent = '確認歷史資料範圍…';
  try {
    await DBMgr.ensureRecentMonths(method === 'xq' ? 4 : 2);
  } catch (e) {
    console.warn('補齊歷史月份時部分失敗，仍嘗試以目前已有資料篩選：', e.message);
  }

  R.strongStatus.textContent = '運算中…（掃描全市場，請稍候）';
  await new Promise(r => setTimeout(r, 20)); // let the status text paint before the heavy query

  const params = Settings.get('strongParams') || {};
  const t0 = performance.now();
  let results = [];
  try {
    results = method === 'xq'
      ? DBMgr.computeStrongXQ(100, params.rsThreshold ?? 90, params.minVolRatio ?? 0.8, params.nearHighPct ?? 15)
      : DBMgr.computeStrongCurrent(100, params.minScore ?? 2);
  } catch (e) {
    console.error(e);
    R.strongStatus.textContent = '篩選失敗：' + e.message;
    R.strongFilterBtn.disabled = false;
    return;
  }
  const dt = ((performance.now() - t0) / 1000).toFixed(1);

  State.strongMethodUsed = method;
  State.strongCache = { method, results };
  State.stocks = results;
  State.page   = 0;
  updateExtraColumn('strong');
  renderPage();
  R.strongStatus.textContent = `共 ${results.length} 檔（耗時 ${dt}s）`;
  R.strongFilterBtn.disabled = false;
}

function loadWatchlist() {
  const wl     = Settings.get('watchlist') || [];
  const rows   = DBMgr.getWatchlistStocks(wl);
  // preserve watchlist order
  const idxMap = Object.fromEntries(wl.map((c, i) => [c, i]));
  rows.sort((a, b) => (idxMap[a.stock_code] ?? 999) - (idxMap[b.stock_code] ?? 999));
  State.stocks = rows;
  State.page   = 0;
  renderPage();
}

function switchView(view) {
  R.sectorSel.classList.toggle('hidden', view !== 'sector');
  R.wlBar.classList.toggle('hidden',     view !== 'watchlist');
  R.strongBar.classList.toggle('hidden', view !== 'strong');

  updateExtraColumn(view);

  if (view === 'strong') {
    if (State.strongCache) {
      State.strongMethodUsed = State.strongCache.method;
      State.stocks = State.strongCache.results;
      R.strongMethodSel.value = State.strongCache.method;
      updateExtraColumn(view);
    } else {
      State.stocks = [];
    }
    State.page = 0;
    if (!State.stocks.length) {
      R.stockTbody.innerHTML = '<tr><td colspan="8" class="empty-hint">請按下「過濾強勢股」開始篩選</td></tr>';
      R.pageInfo.textContent = '— / —';
      R.prevBtn.disabled = true; R.nextBtn.disabled = true;
    } else {
      renderPage();
    }
  }
  else if (view === 'watchlist') loadWatchlist();
  else {
    const sid = R.sectorSel.value;
    if (sid) loadSector(sid);
    else { State.stocks = []; State.page = 0; renderPage(); }
  }
}

/* ════════════════════════════════════════
   STOCK SELECT → CHART
   ════════════════════════════════════════ */
function selectStock(code) {
  Settings.set('selectedStock', code);

  R.stockTbody.querySelectorAll('tr').forEach(tr =>
    tr.classList.toggle('selected', tr.dataset.code === code)
  );

  const info = DBMgr.getStockInfo(code);
  R.chartTitle.textContent = info ? `${code}  ${info.stock_name}` : code;

  const history = DBMgr.getPriceHistory(code, 250);
  Chart.setData(history);

  if (history.length) {
    const last = history.at(-1);
    const prev = history.at(-2);
    const chg  = prev ? (((last.close - prev.close) / prev.close) * 100).toFixed(2) : null;
    const sign  = chg > 0 ? '+' : '';
    R.chartInfo.textContent = chg != null
      ? `最後 ${last.trade_date}  收 ${last.close?.toFixed(2)}  (${sign}${chg}%)`
      : `最後 ${last.trade_date}  收 ${last.close?.toFixed(2)}`;
  } else {
    R.chartInfo.textContent = '';
  }

  /* mobile: picking a stock naturally means "now show me the chart" —
     switch tab (portrait) / close the drawer (landscape). No-op on desktop
     since these classes only affect layout inside the compact media queries. */
  switchMobileTab('chart');
  setDrawerOpen(false);
}

/* ════════════════════════════════════════
   WATCHLIST HELPERS
   ════════════════════════════════════════ */
function addToWatchlist() {
  const code = R.wlInput.value.trim().toUpperCase();
  if (!code) return;
  const wl = Settings.get('watchlist') || [];
  if (!wl.includes(code)) { wl.push(code); Settings.set('watchlist', wl); }
  R.wlInput.value = '';
  loadWatchlist();
}

function removeFromWatchlist(code) {
  const wl  = Settings.get('watchlist') || [];
  const idx = wl.indexOf(code);
  if (idx >= 0) { wl.splice(idx, 1); Settings.set('watchlist', wl); loadWatchlist(); }
}

/* ════════════════════════════════════════
   INIT DB + DAILY SYNC
   ════════════════════════════════════════ */
async function initDB() {
  const progress = (msg, pct, sub) => setProgress(msg, pct, sub);

  const { needBootstrap } = await DBMgr.init(progress);
  if (needBootstrap) {
    /* 首次安裝／快取失效：只下載 core.db + 最近幾個月（小），不下載整份 300MB+ 的
       完整 tw_stock.db — 這正是「網頁下載超級花時間」要解決的地方。 */
    await DBMgr.bootstrapFresh(progress);
  } else {
    /* 已從本地存儲載入；仍取一次 manifest，供之後 zoom out 時查詢可用月份 */
    await DBMgr.fetchWebManifest().catch(e => console.warn('取得 manifest 失敗（zoom out 時會再重試）：', e.message));
  }

  /* 目前月份的 db/monthly 快照只在每月初重建一次，中間的每日資料一律靠這裡的
     每日增量 CSV 補齊（沿用既有的 syncDaily，已支援平行下載 + 自我修復重驗證）。 */
  setProgress('同步每日資料…', 96, '');
  await DBMgr.syncDaily(progress, false);
}

async function handleSync() {
  showLoading(true);
  R.lErr.style.display  = 'none';
  R.lRetry.style.display= 'none';
  R.lBar.style.background = '';
  R.lBar.style.width      = '0%';

  try {
    setProgress('檢查更新…', 10);
    await DBMgr.fetchWebManifest().catch(() => {});
    setProgress('同步每日資料…', 50);
    await DBMgr.syncDaily(setProgress, true);
    setProgress('更新完成！', 100);
    setTimeout(() => { showLoading(false); refreshCurrentView(); }, 800);
  } catch (e) {
    showError('更新失敗：' + e.message);
  }
}

/* ════════════════════════════════════════
   ON-DEMAND HISTORY (zoom out beyond loaded months)
   ════════════════════════════════════════ */
let expandingHistory = false;
async function maybeExpandHistory() {
  if (expandingHistory) return;
  const code = Settings.get('selectedStock');
  if (!code) return;
  const need = Chart.getVisibleCount();
  const have = Chart.getFullDataLength();
  if (need <= have) return;              // 目前已載入的資料已經夠顯示這個 zoom 範圍
  if (!DBMgr.hasOlderMonthAvailable()) return; // 已經是最早可用的月份，沒有更多資料了

  expandingHistory = true;
  R.chartFetchHint.textContent = '載入更早歷史資料中…';
  R.chartFetchHint.classList.remove('hidden');
  try {
    const older = DBMgr.oneOlderMonthLabel();
    await DBMgr.ensureMonthsLoaded([older]);
    const history = DBMgr.getPriceHistory(code, Math.max(need + 60, 400));
    Chart.setData(history);
  } catch (e) {
    console.warn('補齊更早歷史資料失敗：', e.message);
  } finally {
    expandingHistory = false;
    R.chartFetchHint.classList.add('hidden');
  }
}

function refreshCurrentView() {
  const v = R.viewSel.value;
  if (v === 'strong') switchView('strong'); // keep cached results / hint; user re-runs the filter manually
  else if (v === 'watchlist') loadWatchlist();
  else loadSector(R.sectorSel.value);

  const sel = Settings.get('selectedStock');
  if (sel) selectStock(sel);
}

/* ════════════════════════════════════════
   POPULATE SECTORS DROPDOWN
   ════════════════════════════════════════ */
function populateSectors() {
  const sectors = DBMgr.getSectors();
  R.sectorSel.innerHTML = '<option value="">── 選擇類股 ──</option>';
  sectors.forEach(({ sid }) => {
    const id   = parseInt(sid);
    const name = SECTOR_NAMES[id] || `類股 ${id}`;
    const opt  = document.createElement('option');
    opt.value       = id;
    opt.textContent = name;
    R.sectorSel.appendChild(opt);
