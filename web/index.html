  const saved = Settings.get('sectorId');
  if (saved) {
    R.sectorSel.value = saved;
    if (R.sectorSel.value) loadSector(saved);
  }
}

/* ════════════════════════════════════════
   SIDEBAR RESIZE
   ════════════════════════════════════════ */
(function setupResize() {
  let dragging = false, startX = 0, startW = 0;
  R.resizeHandle.addEventListener('mousedown', e => {
    dragging = true;
    startX   = e.clientX;
    startW   = R.sidebar.offsetWidth;
    R.resizeHandle.classList.add('dragging');
    document.body.style.cursor = 'col-resize';
    document.body.style.userSelect = 'none';
  });
  document.addEventListener('mousemove', e => {
    if (!dragging) return;
    const w = Math.min(480, Math.max(200, startW + e.clientX - startX));
    R.sidebar.style.width = w + 'px';
    Chart.resize();
  });
  document.addEventListener('mouseup', () => {
    if (!dragging) return;
    dragging = false;
    R.resizeHandle.classList.remove('dragging');
    document.body.style.cursor = '';
    document.body.style.userSelect = '';
  });
})();

/* ════════════════════════════════════════
   MOBILE LAYOUT — portrait tab-switch (list ⇄ chart) + landscape drawer
   ════════════════════════════════════════ */
function switchMobileTab(tab) {
  R.main.classList.toggle('show-list', tab === 'list');
  R.main.classList.toggle('show-chart', tab === 'chart');
  R.mtabList.classList.toggle('active', tab === 'list');
  R.mtabChart.classList.toggle('active', tab === 'chart');
  if (tab === 'chart') setTimeout(() => Chart.resize(), 50); // was display:none, needs a resize once visible
}

function setDrawerOpen(open) {
  R.main.classList.toggle('drawer-open', open);
  if (!open) setTimeout(() => Chart.resize(), 250); // match the CSS transition duration
}

/* ════════════════════════════════════════
   EVENT BINDINGS
   ════════════════════════════════════════ */
function bindEvents() {
  /* menu toggle */
  R.menuBtn.addEventListener('click', e => {
    e.stopPropagation();
    R.menuDrop.classList.toggle('hidden');
  });
  document.addEventListener('click', () => R.menuDrop.classList.add('hidden'));
  R.menuDrop.addEventListener('click', e => {
    const act = e.target.dataset.act;
    if (act === 'new')    { if (confirm('清除所有設定？')) { Settings.reset(); location.reload(); } }
    if (act === 'open')   R.fileInput.click();
    if (act === 'export') Settings.exportSettings();
    if (act === 'save')   { Settings.save(); alert('設定已儲存'); }
  });
  R.fileInput.addEventListener('change', async e => {
    const f = e.target.files[0];
    if (f) { await Settings.importFile(f); alert('設定已匯入'); refreshCurrentView(); }
    e.target.value = '';
  });

  /* theme */
  R.themeBtn.addEventListener('click', () => {
    const t = Settings.get('theme') === 'light' ? 'dark' : 'light';
    Settings.set('theme', t);
    applyTheme(t);
  });

  /* sync */
  R.syncBtn.addEventListener('click', handleSync);

  /* mobile portrait tab-switch (list ⇄ chart) */
  R.mtabList.addEventListener('click', () => switchMobileTab('list'));
  R.mtabChart.addEventListener('click', () => switchMobileTab('chart'));

  /* mobile landscape drawer (sidebar slide-out) */
  R.drawerToggleBtn.addEventListener('click', () => setDrawerOpen(!R.main.classList.contains('drawer-open')));
  R.drawerOverlay.addEventListener('click', () => setDrawerOpen(false));

  /* orientation/viewport changes can affect which layout mode is active */
  window.addEventListener('orientationchange', () => setTimeout(() => Chart.resize(), 250));

  /* view select */
  R.viewSel.addEventListener('change', () => {
    Settings.set('view', R.viewSel.value);
    switchView(R.viewSel.value);
  });

  /* sector select */
  R.sectorSel.addEventListener('change', () => {
    Settings.set('sectorId', R.sectorSel.value);
    loadSector(R.sectorSel.value);
  });

  /* watchlist add */
  R.wlAdd.addEventListener('click', addToWatchlist);
  R.wlInput.addEventListener('keydown', e => { if (e.key === 'Enter') addToWatchlist(); });

  /* 強勢股 filter */
  R.strongMethodSel.addEventListener('change', () => Settings.set('strongMethod', R.strongMethodSel.value));
  R.strongFilterBtn.addEventListener('click', runStrongFilter);

  /* paginator */
  R.prevBtn.addEventListener('click', () => { if (State.page > 0) { State.page--; renderPage(); } });
  R.nextBtn.addEventListener('click', () => {
    const max = Math.max(0, Math.ceil(State.stocks.length / PAGE_SIZE) - 1);
    if (State.page < max) { State.page++; renderPage(); }
  });

  /* retry */
  R.retryBtn.addEventListener('click', () => location.reload());

  /* chart sub-panel toggle */
  R.subpanelToggle.addEventListener('click', e => {
    const btn = e.target.closest('.seg-btn');
    if (!btn) return;
    R.subpanelToggle.querySelectorAll('.seg-btn').forEach(b => b.classList.toggle('active', b === btn));
    const panel = btn.dataset.panel;
    Settings.set('chartSubPanel', panel);
    Chart.setSubPanel(panel);
  });

  /* chart zoom */
  R.zoomInBtn.addEventListener('click', () => Chart.zoomIn());
  R.zoomOutBtn.addEventListener('click', () => Chart.zoomOut());
  R.zoomResetBtn.addEventListener('click', () => Chart.zoomReset());

  /* chart settings modal */
  R.chartSettingsBtn.addEventListener('click', openSettingsModal);
  R.settingsClose.addEventListener('click', closeSettingsModal);
  R.settingsCancel.addEventListener('click', closeSettingsModal);
  R.settingsModal.addEventListener('click', e => { if (e.target === R.settingsModal) closeSettingsModal(); });
  R.settingsModal.querySelectorAll('.modal-cat').forEach(cat => {
    cat.addEventListener('click', () => {
      R.settingsModal.querySelectorAll('.modal-cat').forEach(c => c.classList.toggle('active', c === cat));
      R.settingsModal.querySelectorAll('.modal-pane').forEach(p =>
        p.classList.toggle('hidden', p.dataset.pane !== cat.dataset.cat)
      );
    });
  });
  R.settingsSave.addEventListener('click', saveSettingsModal);

  /* resize */
  window.addEventListener('resize', () => Chart.resize());
}

/* ════════════════════════════════════════
   SETTINGS MODAL (Eclipse-like categorized preferences)
   ════════════════════════════════════════ */
function openSettingsModal() {
  const ma = Settings.get('maPeriods') || { short:5, mid:20, long:60 };
  R.maShortInput.value = ma.short;
  R.maMidInput.value   = ma.mid;
  R.maLongInput.value  = ma.long;

  const sp = Settings.get('strongParams') || {};
  R.strongMinScoreInput.value = sp.minScore ?? 2;
  R.strongRsThInput.value     = sp.rsThreshold ?? 90;
  R.strongVolRatioInput.value = sp.minVolRatio ?? 0.8;
  R.strongNearHighInput.value = sp.nearHighPct ?? 15;

  R.settingsModal.classList.remove('hidden');
}

function closeSettingsModal() {
  R.settingsModal.classList.add('hidden');
}

function saveSettingsModal() {
  const short = parseInt(R.maShortInput.value, 10);
  const mid   = parseInt(R.maMidInput.value, 10);
  const long  = parseInt(R.maLongInput.value, 10);
  if ([short, mid, long].some(v => !Number.isFinite(v) || v < 1)) {
    alert('均線週期必須是正整數');
    return;
  }
  const maPeriods = { short, mid, long };
  Settings.set('maPeriods', maPeriods);
  Chart.setMAPeriods(maPeriods);

  const strongParams = {
    minScore:    parseInt(R.strongMinScoreInput.value, 10) || 0,
    rsThreshold: parseInt(R.strongRsThInput.value, 10) || 90,
    minVolRatio: parseFloat(R.strongVolRatioInput.value) || 0,
    nearHighPct: parseFloat(R.strongNearHighInput.value) || 15,
  };
  Settings.set('strongParams', strongParams);

  closeSettingsModal();
}

/* ════════════════════════════════════════
   BOOTSTRAP
   ════════════════════════════════════════ */
async function main() {
  bindEvents();
  Chart.setOnZoomChange(maybeExpandHistory);

  /* restore theme */
  applyTheme(Settings.get('theme') || 'light');

  /* restore chart prefs */
  Chart.setMAPeriods(Settings.get('maPeriods') || { short:5, mid:20, long:60 });
  const savedPanel = Settings.get('chartSubPanel') || 'volume';
  Chart.setSubPanel(savedPanel);
  R.subpanelToggle.querySelectorAll('.seg-btn').forEach(b =>
    b.classList.toggle('active', b.dataset.panel === savedPanel)
  );
  R.strongMethodSel.value = Settings.get('strongMethod') || 'current';

  /* restore view selector (migrate old 'top100' value from earlier versions) */
  let savedView = Settings.get('view') || 'sector';
  if (savedView === 'top100') savedView = 'strong';
  R.viewSel.value = savedView;

  showLoading(true);
  try {
    await initDB();
    showLoading(false);
  } catch (e) {
    console.error(e);
    showError(e.message || String(e));
    return;
  }

  /* populate sectors */
  populateSectors();

  /* restore / init view */
  switchView(savedView);

  /* restore selected stock */
  const sel = Settings.get('selectedStock');
  if (sel && DBMgr.isReady()) selectStock(sel);

  /* initial chart resize */
  setTimeout(() => Chart.resize(), 50);
}

main().catch(e => console.error('App crash:', e));
</script>
